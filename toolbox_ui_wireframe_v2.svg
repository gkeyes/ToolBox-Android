    <!-- chips -->
    <rect x="28" y="226" width="76" height="34" rx="17" fill="#007AFF"/>
    <text x="66" y="249" class="t" font-size="14" text-anchor="middle" style="fill:#fff">全部</text>
    <rect x="114" y="226" width="76" height="34" rx="17" fill="#FFFFFF"/>
    <text x="152" y="249" class="t" font-size="14" text-anchor="middle">计算</text>
