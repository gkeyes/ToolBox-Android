    <rect x="12" y="12" rx="44" ry="44" width="476" height="876" fill="#F2F2F7"/>
    <text x="48" y="53" class="t body" font-size="16">9:41</text>
    <g transform="translate(395,34)" fill="#111827"><rect x="0" y="10" width="5" height="8" rx="2"/><rect x="8" y="7" width="5" height="11" rx="2"/><rect x="16" y="4" width="5" height="14" rx="2"/><rect x="24" y="1" width="5" height="17" rx="2"/><path d="M42,14 q12,-14 24,0 q-12,-8 -24,0" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/><rect x="76" y="3" width="31" height="16" rx="5" fill="none" stroke="#111827" stroke-width="2"/><rect x="108" y="8" width="3" height="6" rx="1"/><rect x="79" y="6" width="22" height="10" rx="3"/></g>
    <text x="38" y="118" class="t screenTitle">设置</text>

    <text x="38" y="176" class="t section">外观</text>
    <rect x="28" y="198" width="444" height="78" rx="20" fill="#FFFFFF"/>
    <text x="50" y="228" class="t body">主题</text>
    <text x="50" y="253" class="t meta muted">跟随系统</text>
    <path d="M438 225 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="38" y="326" class="t section">运行与信任</text>
    <rect x="28" y="348" width="444" height="228" rx="20" fill="#FFFFFF"/>
    <text x="50" y="379" class="t body">运行模式</text>
    <text x="50" y="404" class="t meta muted">个人模式 · 自有工具减少确认</text>
    <text x="424" y="392" class="t blue" font-size="14" text-anchor="end">个人</text>
    <path d="M438 384 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="426" x2="454" y2="426" stroke="#E5E5EA"/>
    <text x="50" y="458" class="t body">我的签名密钥</text>
    <text x="50" y="483" class="t meta muted">自有签名工具可自动信任</text>
    <path d="M438 463 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="502" x2="454" y2="502" stroke="#E5E5EA"/>
    <text x="50" y="536" class="t body">审计日志</text>
    <text x="50" y="561" class="t meta muted">保留 30 天 · 仅最小元数据</text>
    <path d="M438 540 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="38" y="626" class="t section">关于</text>
    <rect x="28" y="648" width="444" height="152" rx="20" fill="#FFFFFF"/>
    <text x="50" y="681" class="t body">性能诊断</text><text x="50" y="706" class="t meta muted">帧率、启动耗时、WebView 状态</text><path d="M438 688 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="724" x2="454" y2="724" stroke="#E5E5EA"/>
    <text x="50" y="759" class="t body">关于 ToolBox</text><text x="50" y="784" class="t meta muted">版本、开源许可、数据说明</text><path d="M438 766 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="12" y1="801" x2="488" y2="801" stroke="#D9D9DE" stroke-width="1"/>
    <rect x="12" y="802" width="476" height="86" fill="#FFFFFF" fill-opacity="0.94"/>
    <g transform="translate(90,824)"><path d="M0 16 L14 4 L28 16 V32 H18 V22 H10 V32 H0Z" fill="#8E8E93"/><text x="14" y="54" class="t tab muted" text-anchor="middle">首页</text></g>
    <g transform="translate(232,824)"><g fill="#8E8E93"><rect x="0" y="4" width="11" height="11" rx="2"/><rect x="17" y="4" width="11" height="11" rx="2"/><rect x="0" y="21" width="11" height="11" rx="2"/><rect x="17" y="21" width="11" height="11" rx="2"/></g><text x="14" y="54" class="t tab muted" text-anchor="middle">工具</text></g>
    <g transform="translate(374,824)"><circle cx="14" cy="13" r="7" fill="none" stroke="#007AFF" stroke-width="3"/><path d="M14 0 v5 M14 21 v5 M1 13 h5 M22 13 h5 M5 4 l4 4 M19 18 l4 4 M23 4 l-4 4 M9 18 l-4 4" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/><text x="14" y="54" class="t tab blue" text-anchor="middle">设置</text></g>
  </g>

  <!-- measure notes -->
  <g transform="translate(90,1095)">
    <rect x="0" y="0" width="1620" height="58" rx="18" fill="#FFFFFF"/>
    <text x="24" y="36" class="t measure">关键尺寸：页面边距 16dp　搜索框 48dp　工具行 72–80dp　分组圆角 16dp　底栏内容 56dp + 系统导航区　顶部不再使用突兀白色带</text>
  </g>
