    <rect x="28" y="466" width="444" height="84" rx="20" fill="#FFFFFF"/>
    <rect x="46" y="482" width="48" height="48" rx="14" fill="#E9F2FF"/>
    <text x="70" y="514" class="t blue" font-size="19" text-anchor="middle">仓</text>
    <text x="112" y="500" class="t body">仓位计算器</text>
    <text x="112" y="525" class="t meta muted">1.0.0 · 未签名</text>
    <path d="M438 497 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

