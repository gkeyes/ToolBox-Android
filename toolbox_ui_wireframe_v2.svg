    <line x1="12" y1="801" x2="488" y2="801" stroke="#D9D9DE" stroke-width="1"/>
    <rect x="12" y="802" width="476" height="86" rx="0" fill="#FFFFFF" fill-opacity="0.94"/>
    <g transform="translate(90,824)">
      <path d="M0 16 L14 4 L28 16 V32 H18 V22 H10 V32 H0Z" fill="#007AFF"/>
      <text x="14" y="54" class="t tab blue" text-anchor="middle">首页</text>
    </g>
    <g transform="translate(232,824)">
      <g fill="#8E8E93"><rect x="0" y="4" width="11" height="11" rx="2"/><rect x="17" y="4" width="11" height="11" rx="2"/><rect x="0" y="21" width="11" height="11" rx="2"/><rect x="17" y="21" width="11" height="11" rx="2"/></g>
      <text x="14" y="54" class="t tab muted" text-anchor="middle">工具</text>
    </g>
    <g transform="translate(374,824)">
      <circle cx="14" cy="13" r="7" fill="none" stroke="#8E8E93" stroke-width="3"/><path d="M14 0 v5 M14 21 v5 M1 13 h5 M22 13 h5 M5 4 l4 4 M19 18 l4 4 M23 4 l-4 4 M9 18 l-4 4" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round"/>
      <text x="14" y="54" class="t tab muted" text-anchor="middle">设置</text>
    </g>
  </g>

  <!-- Phone 2 -->
  <g transform="translate(650,160)">
    <rect x="0" y="0" rx="54" ry="54" width="500" height="900" fill="#FFFFFF"/>
    <rect x="12" y="12" rx="44" ry="44" width="476" height="876" fill="#F2F2F7"/>
    <text x="48" y="53" class="t body" font-size="16">9:41</text>
    <g transform="translate(395,34)" fill="#111827"><rect x="0" y="10" width="5" height="8" rx="2"/><rect x="8" y="7" width="5" height="11" rx="2"/><rect x="16" y="4" width="5" height="14" rx="2"/><rect x="24" y="1" width="5" height="17" rx="2"/><path d="M42,14 q12,-14 24,0 q-12,-8 -24,0" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/><rect x="76" y="3" width="31" height="16" rx="5" fill="none" stroke="#111827" stroke-width="2"/><rect x="108" y="8" width="3" height="6" rx="1"/><rect x="79" y="6" width="22" height="10" rx="3"/></g>
