    <circle cx="53" cy="182" r="8" fill="none" stroke="#8E8E93" stroke-width="2.5"/>
    <line x1="59" y1="188" x2="66" y2="195" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round"/>
