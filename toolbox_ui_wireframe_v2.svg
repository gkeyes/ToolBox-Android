    <rect x="46" y="343" width="52" height="52" rx="15" fill="#1677FF"/>
    <text x="72" y="378" class="t" font-size="23" text-anchor="middle" style="fill:#fff">仓</text>
    <text x="118" y="363" class="t body">仓位计算器</text>
    <text x="118" y="389" class="t meta muted">1.0.0 · 7 KB · 未签名</text>
    <circle cx="437" cy="369" r="18" fill="#F2F2F7"/>
    <circle cx="437" cy="362" r="2.2" fill="#8E8E93"/><circle cx="437" cy="369" r="2.2" fill="#8E8E93"/><circle cx="437" cy="376" r="2.2" fill="#8E8E93"/>

    <line x1="12" y1="801" x2="488" y2="801" stroke="#D9D9DE" stroke-width="1"/>
    <rect x="12" y="802" width="476" height="86" fill="#FFFFFF" fill-opacity="0.94"/>
    <g transform="translate(90,824)"><path d="M0 16 L14 4 L28 16 V32 H18 V22 H10 V32 H0Z" fill="#8E8E93"/><text x="14" y="54" class="t tab muted" text-anchor="middle">首页</text></g>
    <g transform="translate(232,824)"><g fill="#007AFF"><rect x="0" y="4" width="11" height="11" rx="2"/><rect x="17" y="4" width="11" height="11" rx="2"/><rect x="0" y="21" width="11" height="11" rx="2"/><rect x="17" y="21" width="11" height="11" rx="2"/></g><text x="14" y="54" class="t tab blue" text-anchor="middle">工具</text></g>
    <g transform="translate(374,824)"><circle cx="14" cy="13" r="7" fill="none" stroke="#8E8E93" stroke-width="3"/><path d="M14 0 v5 M14 21 v5 M1 13 h5 M22 13 h5 M5 4 l4 4 M19 18 l4 4 M23 4 l-4 4 M9 18 l-4 4" stroke="#8E8E93" stroke-width="2.5" stroke-linecap="round"/><text x="14" y="54" class="t tab muted" text-anchor="middle">设置</text></g>
  </g>

  <!-- Phone 3 -->
  <g transform="translate(1210,160)">
