    <text x="118" y="349" class="t body">导入工具</text>
    <text x="118" y="373" class="t meta muted">选择本机 .tbx 文件</text>
    <path d="M438 349 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

