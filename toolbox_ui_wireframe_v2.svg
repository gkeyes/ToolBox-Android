<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style>
      .t { font-family: 'Noto Sans CJK SC', 'Noto Sans CJK JP', sans-serif; fill:#111827; }
      .muted { fill:#8E8E93; }
      .blue { fill:#007AFF; }
      .title { font-size:38px; font-weight:700; }
      .screenTitle { font-size:30px; font-weight:700; }
      .section { font-size:20px; font-weight:650; }
      .body { font-size:18px; font-weight:500; }
      .meta { font-size:14px; font-weight:400; }
      .tab { font-size:13px; font-weight:500; }
      .measure { font-size:16px; font-weight:600; fill:#007AFF; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#F4F6FA"/>
  <text x="80" y="72" class="t title">ToolBox V2 · 轻量化界面草图</text>
  <text x="80" y="108" class="t muted" font-size="19">目标：层级更少、卡片更紧凑、滚动更轻、接近 iOS grouped-list 的视觉秩序</text>

  <!-- Phone 1 -->
  <g transform="translate(90,160)">
    <rect x="0" y="0" rx="54" ry="54" width="500" height="900" fill="#FFFFFF"/>
    <rect x="12" y="12" rx="44" ry="44" width="476" height="876" fill="#F2F2F7"/>
    <!-- status -->
    <text x="48" y="53" class="t body" font-size="16">9:41</text>
    <g transform="translate(395,34)" fill="#111827">
      <rect x="0" y="10" width="5" height="8" rx="2"/><rect x="8" y="7" width="5" height="11" rx="2"/><rect x="16" y="4" width="5" height="14" rx="2"/><rect x="24" y="1" width="5" height="17" rx="2"/>
      <path d="M42,14 q12,-14 24,0 q-12,-8 -24,0" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
      <rect x="76" y="3" width="31" height="16" rx="5" fill="none" stroke="#111827" stroke-width="2"/><rect x="108" y="8" width="3" height="6" rx="1"/><rect x="79" y="6" width="22" height="10" rx="3"/>
    </g>
    <!-- header same background, no white band -->
    <text x="38" y="118" class="t screenTitle">ToolBox</text>
    <text x="38" y="147" class="t muted" font-size="15">本地运行的小工具</text>
    <circle cx="438" cy="114" r="22" fill="#FFFFFF"/>
    <path d="M438 103 V125 M427 114 H449" stroke="#007AFF" stroke-width="3" stroke-linecap="round"/>

    <text x="38" y="202" class="t section">常用工具</text>
    <rect x="28" y="224" width="444" height="170" rx="20" fill="#FFFFFF"/>
    <!-- row 1 -->
    <rect x="46" y="246" width="52" height="52" rx="15" fill="#1677FF"/>
    <text x="72" y="281" class="t" font-size="23" text-anchor="middle" fill="#FFFFFF" style="fill:#fff">仓</text>
    <text x="118" y="268" class="t body">仓位计算器</text>
    <text x="118" y="292" class="t meta muted">最近使用 · 7 KB</text>
    <path d="M438 268 l7 7 -7 7" fill="none" stroke="#C7C7CC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="118" y1="311" x2="454" y2="311" stroke="#E5E5EA" stroke-width="1"/>
    <!-- row 2 -->
    <rect x="46" y="327" width="52" height="52" rx="15" fill="#8E8E93"/>
