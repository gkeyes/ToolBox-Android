<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>仓位计算器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <header class="hero">
      <p class="eyebrow">风险仓位</p>
      <h1 id="page-title">仓位计算器</h1>
      <p>按单笔可承受风险，计算整手建议仓位。</p>
    </header>
    <form id="calculator" novalidate>
      <div class="input-grid">
        <label>账户资金（元）<input id="capital" name="capital" type="number" inputmode="decimal" min="0" value="100000" required /></label>
        <label>单笔风险比例（%）<input id="risk" name="risk" type="number" inputmode="decimal" min="0" step="0.1" value="1" required /></label>
        <label>入场价（元）<input id="entry" name="entry" type="number" inputmode="decimal" min="0" step="0.01" value="10" required /></label>
        <label>止损价（元）<input id="stop" name="stop" type="number" inputmode="decimal" min="0" step="0.01" value="9.5" required /></label>
      </div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <button class="primary" type="submit">计算建议仓位</button>
    </form>
    <section id="result" class="result" aria-live="polite" hidden>
      <p class="result-label">建议买入</p>
      <strong id="shares">0 股</strong>
      <dl>
        <div><dt>预计占用资金</dt><dd id="amount">0.00 元</dd></div>
        <div><dt>单笔最大风险</dt><dd id="risk-amount">0.00 元</dd></div>
      </dl>
      <button id="copy" class="secondary" type="button">复制计算结果</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
