<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GitHub 构建守望</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="app-title">
    <header class="tool-identity" aria-labelledby="app-title">
      <img class="tool-icon" src="icon.png" alt="">
      <div class="identity-copy">

        <div class="title-row">
          <h1 id="app-title">构建守望</h1>
          <span id="runtime-chip" class="status-chip" data-state="idle">未配置</span>
        </div>
        <p id="host-caption" class="muted">正在连接 ToolBox…</p>
      </div>
    </header>

    <section id="setup-screen" aria-labelledby="setup-title">
      <div class="surface intro-surface">

        <h2 id="setup-title">连接一个仓库</h2>
        <p class="supporting">粘贴 GitHub 链接，构建有结果时通知你。只读监控，不会更改仓库。</p>
        <label class="field-label" for="repo-input">GitHub 仓库链接</label>
        <input id="repo-input" class="text-field" type="url" inputmode="url" autocomplete="url" placeholder="https://github.com/owner/repo">
        <label class="field-label" for="token-input">访问令牌 Token（可选）</label>
        <input id="token-input" class="text-field" type="password" autocomplete="off" aria-describedby="token-state" placeholder="私有仓库或快速刷新时使用">
        <p id="token-state" class="supporting" role="status">公共仓库可不填；Token 保存一次即可复用</p>
        <div class="token-row">
          <button id="save-token" class="text-button" type="button">保存 Token</button>
          <button id="clear-token" class="text-button" type="button" hidden>清除已保存 Token</button>
        </div>
        <button id="load-repository" class="primary-button full-width" type="button">读取仓库</button>
      </div>

      <div id="selection-surface" class="surface" hidden>
        <div class="section-heading">
          <div>

            <h2 id="repository-name">仓库</h2>
          </div>
          <button id="change-repository" class="text-button" type="button">更换</button>
        </div>
        <p id="repository-detail" class="supporting"></p>

        <fieldset class="choice-group">
          <legend>选择工作流</legend>
          <p class="supporting">选择需要关注的构建流程。</p>
          <div id="workflow-list" class="workflow-list"></div>
        </fieldset>

        <fieldset class="choice-group">
          <legend>分支范围</legend>
          <label class="radio-row">
            <input type="radio" name="branch-mode" value="branch" checked>
            <span>指定分支</span>
          </label>
          <label id="branch-picker-label" class="field-label branch-field-label" for="branch-select">从仓库分支选择</label>
          <div id="branch-picker" class="branch-picker">
            <button id="branch-select" class="text-field branch-select" type="button" aria-labelledby="branch-picker-label branch-selected-text" aria-expanded="false" aria-controls="branch-options">
              <span id="branch-selected-text">选择分支</span>
              <span class="branch-chevron" aria-hidden="true"></span>
            </button>
            <div id="branch-options" class="branch-options" role="group" aria-label="仓库分支" hidden></div>
          </div>
          <p id="branch-count" class="supporting branch-count"></p>
          <input id="branch-manual" class="text-field compact-field" type="text" autocomplete="off" placeholder="或手动输入分支名">
          <label class="radio-row">
            <input type="radio" name="branch-mode" value="all">
            <span>全部分支</span>
          </label>
        </fieldset>

        <button id="start-watching" class="primary-button full-width" type="button" disabled>开始守望</button>
      </div>
    </section>

    <section id="watch-screen" aria-labelledby="watch-title" hidden>
      <article class="hero" id="hero-card" data-tone="neutral">
        <div class="hero-topline">
          <div class="hero-identity">
            <p id="run-repository" class="repo-label"></p>
            <h2 id="watch-title">等待构建</h2>
          </div>
          <span id="hero-state" class="status-chip">等待构建</span>
        </div>
        <p id="run-workflow" class="workflow-label"></p>
        <div class="progress-heading">
          <strong id="progress-value">--</strong>
          <div class="progress-caption">
            <span id="progress-caption">预估进度</span>
            <span id="step-count"></span>
          </div>
        </div>
        <div id="progress-ring" class="progress-track" role="progressbar" aria-label="预估构建进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progress-fill"></span>
        </div>
        <div class="stage-row">
          <span id="stage-dot" class="state-dot" data-state="idle" aria-hidden="true"></span>
          <p id="current-step" class="current-step">有新构建时会自动跟进</p>
        </div>
        <div class="time-grid">
          <div><span>已用时间</span><strong id="elapsed-time">--</strong></div>
          <div><span id="remaining-label">预计剩余</span><strong id="remaining-time">待估算</strong></div>
        </div>
      </article>

      <div id="network-banner" class="network-banner" role="status" hidden>
        <span class="banner-dot" aria-hidden="true"></span>
        <span id="network-message"></span>
      </div>

      <div class="sync-row" aria-label="同步状态">
        <span id="poll-countdown" role="timer" aria-live="off">等待首次同步</span>
        <button id="refresh-now" class="text-button" type="button">刷新</button>
      </div>

      <details id="active-section" class="surface disclosure" hidden>
        <summary class="disclosure-heading">
          <span>其他构建</span>
          <span id="active-count" class="count-label">0 个</span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div id="active-runs" class="stack-list disclosure-body"></div>
      </details>

      <details id="build-details" class="surface disclosure">
        <summary class="disclosure-heading">
          <span id="jobs-title">构建详情</span>
          <span id="jobs-summary" class="count-label">暂无步骤</span>
          <span class="chevron" aria-hidden="true"></span>
        </summary>
        <div class="disclosure-body">
          <label class="toggle-row" for="raw-names">
            <span>显示原始名称</span>
            <input id="raw-names" class="switch" type="checkbox">
          </label>
          <div id="job-list" class="job-list"></div>
          <details id="technical-details" class="technical-details">
            <summary>运行信息与估算说明<span class="chevron" aria-hidden="true"></span></summary>
            <dl class="metadata">
              <div><dt>仓库</dt><dd id="meta-repository"></dd></div>
              <div><dt>工作流</dt><dd id="meta-workflow"></dd></div>
              <div><dt>分支</dt><dd id="run-branch"></dd></div>
              <div><dt>提交</dt><dd id="run-sha"></dd></div>
              <div><dt>运行编号</dt><dd id="meta-run"></dd></div>
            </dl>
            <p id="sample-caption" class="supporting"></p>
            <p id="poll-caption" class="supporting"></p>
          </details>
        </div>
      </details>

      <section class="surface history-surface" aria-labelledby="recent-title">
        <div class="section-heading">
          <h2 id="recent-title">最近完成</h2>
          <button id="toggle-history" class="text-button" type="button" aria-expanded="false" aria-controls="recent-runs" hidden>查看全部</button>
        </div>
        <div id="recent-runs" class="recent-list"></div>
      </section>

      <div class="action-bar">
        <div class="action-buttons">
          <button id="open-github" class="secondary-button" type="button">在 GitHub 查看</button>
          <button id="stop-watching" class="danger-button" type="button">停止守望</button>
        </div>
        <p class="footer-caption">仅停止监控，不会取消 GitHub 构建</p>
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden aria-live="polite">
    <div class="loading-card">
      <span class="spinner" aria-hidden="true"></span>
      <strong id="loading-title">读取中</strong>
      <span id="loading-detail">正在连接 GitHub API</span>
    </div>
  </div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="github-model.js"></script>
  <script src="reliability.js"></script>
  <script src="app.js"></script>
</body>
</html>
