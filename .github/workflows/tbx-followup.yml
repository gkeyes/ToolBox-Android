name: Apply credential regression follow-up once
on:
  push:
    branches: ["fix/tbx-update-credential-retention"]
    paths: [".github/workflows/tbx-followup.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/fix/tbx-update-credential-retention' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Apply reviewed source-only changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ab239f41c0c67f55b7355ce7d4e8014189140a08
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p = Path(path); text = p.read_text(); assert old in text, path; p.write_text(text.replace(old, new, 1))
          edit('app/src/test/kotlin/io/toolbox/host/permissions/PermissionCenterViewModelTest.kt',
            '        assertEquals(PackageInstallResult.Installed(TOOL_ID, versionCode, versionCode > 1), manager.importAndInstall(input))',
            '''        val candidate = manager.importAndInstall(input)
                  // The fixture is unsigned: explicitly approve this update without changing any grants.
                  val installed = if (candidate is PackageInstallResult.ConfirmationRequired) {
                      manager.confirmInstall(candidate.confirmation.id)
                  } else candidate
                  assertEquals(PackageInstallResult.Installed(TOOL_ID, versionCode, versionCode > 1), installed)'''.replace('\n          ', '\n'))
          edit('tool-runtime/src/main/kotlin/io/toolbox/tool/runtime/RuntimeProfileManager.kt',
            '''        val acquired = withContext(Dispatchers.Main.immediate) { RuntimeWebViewLifecycle.beginCleanup(toolId) }
                  check(acquired) { "Tool runtime is still in use" }
                  try {
                      return action()'''.replace('\n          ', '\n'),
            '''        // Acquisition must not be lost to prompt cancellation when dispatching back to IO.
                  val acquired = withContext(NonCancellable + Dispatchers.Main.immediate) {
                      RuntimeWebViewLifecycle.beginCleanup(toolId)
                  }
                  check(acquired) { "Tool runtime is still in use" }
                  try {
                      coroutineContext.ensureActive()
                      return action()'''.replace('\n          ', '\n'))
          path = 'app/src/androidTest/kotlin/io/toolbox/host/runtime/TbxUpgradeRuntimeTest.kt'
          edit(path, 'import kotlinx.coroutines.CompletableDeferred\n', 'import kotlinx.coroutines.CompletableDeferred\nimport kotlinx.coroutines.cancelAndJoin\n')
          edit(path, '                .preferredIsolationMode == RuntimeIsolationMode.DEDICATED_PROFILE\n', '                .preferredIsolationMode == RuntimeIsolationMode.DEDICATED_PROFILE\n            android.util.Log.i("TbxUpgradeTest", "PROFILE_RETENTION_ASSERTED=$dedicated")\n')
          test = '''    @Test
              fun cancelledCommitReleasesBarrierAndRestoresOldBundleAndLogin() = runBlocking(Dispatchers.IO) {
                  withTimeout(30_000) {
                      val f = UpgradeFixture()
                      try {
                          f.install(1)
                          f.login(f.page())
                          val original = f.envelope.read()
                          for (version in listOf(2, 1)) {
                              val entered = CompletableDeferred<Unit>()
                              val waiting = object : CatalogLifecycleRepository by f.stores.repositories.lifecycle {
                                  override suspend fun commitInstall(attempt: CatalogInstallAttempt): DataResult<CommitInstallOutcome> {
                                      entered.complete(Unit)
                                      awaitCancellation()
                                  }
                              }
                              val installer = ProductionHostPackageOperations(f.application, f.stores.repositories.copy(lifecycle = waiting),
                                  f.dependencies.runtimeDataCleaner, f.dependencies.backgroundOperations)
                              val pending = installer.importPackage(f.bytes(version, "cancelled")) as HostImportResult.ConfirmationRequired
                              val update = async { installer.confirmImport(pending.confirmation.id) }
                              entered.await()
                              update.cancelAndJoin()
                              assertEquals(1, f.stores.repositories.catalog.observeTool(f.toolId).first()!!.currentVersion.versionCode)
                              assertEquals(original, f.envelope.read())
                              f.assertLogin(f.page(), "1")
                          }
                      } finally { f.close() }
                  }
              }

          '''.replace('\n          ', '\n')
          edit(path, '    @Test\n    fun versionReplacementDrainsStorage', test + '    @Test\n    fun versionReplacementDrainsStorage')
          PY
          git diff --check
          git add app/src/test/kotlin/io/toolbox/host/permissions/PermissionCenterViewModelTest.kt tool-runtime/src/main/kotlin/io/toolbox/tool/runtime/RuntimeProfileManager.kt app/src/androidTest/kotlin/io/toolbox/host/runtime/TbxUpgradeRuntimeTest.kt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: release update barrier on cancellation and approve unsigned test fixtures'
          git push origin HEAD:refs/heads/fix/tbx-update-credential-retention
