name: Browser Legacy WebView Regression

on:
  pull_request:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - "app/src/main/kotlin/io/toolbox/host/browser/BrowserCompatibilityPolicy.kt"
      - "app/src/main/kotlin/io/toolbox/host/browser/BrowserActivity.kt"
      - "tool-runtime/src/main/kotlin/io/toolbox/tool/runtime/RuntimeBrowserUrl.kt"
      - "app/src/androidTest/kotlin/io/toolbox/host/browser/BrowserNavigationInstrumentationTest.kt"
      - "app/src/androidTest/kotlin/io/toolbox/host/browser/BrowserLegacyPageCompatibilityTest.kt"
      - ".github/workflows/browser-legacy-webview.yml"

permissions:
  contents: read

jobs:
  webview:
    name: Verify legacy page compatibility in Android WebView
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile targeted legacy-page instrumentation test
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run legacy page compatibility test in Android WebView
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.host.browser.BrowserLegacyPageCompatibilityTest,io.toolbox.host.browser.BrowserNavigationInstrumentationTest
