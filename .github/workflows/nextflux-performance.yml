name: NextFlux performance comparison

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline commit or ref to compare with the selected workflow ref
        type: string
        required: true
        default: 8d4e9bac9ecc73840e1b8fc66557e35eb5f2bb32

permissions:
  contents: read

concurrency:
  group: nextflux-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare production builds without screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate and shared harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out selected baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
          persist-credentials: false

      - name: Set up the existing Node 22 toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            candidate/examples/nextflux/package-lock.json
            baseline/examples/nextflux/package-lock.json

      - name: Build baseline production dist
        working-directory: baseline/examples/nextflux
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build candidate production dist
        working-directory: candidate/examples/nextflux
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install Chromium from the existing pinned Playwright dependency
        working-directory: candidate/examples/nextflux
        run: npx --no-install playwright install --with-deps chromium

      - name: Run paired comparison with exact local origins
        working-directory: candidate/examples/nextflux
        env:
          NEXTFLUX_CANDIDATE_DIR: ${{ github.workspace }}/candidate
          NEXTFLUX_BASELINE_DIR: ${{ github.workspace }}/baseline
          NEXTFLUX_PERFORMANCE_OUTPUT: ${{ github.workspace }}/performance-results
        run: |
          mkdir -p "$NEXTFLUX_PERFORMANCE_OUTPUT"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$NEXTFLUX_BASELINE_DIR/examples/nextflux/dist" > "$RUNNER_TEMP/nextflux-baseline-server.log" 2>&1 &
          baseline_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory "$NEXTFLUX_CANDIDATE_DIR/examples/nextflux/dist" > "$RUNNER_TEMP/nextflux-candidate-server.log" 2>&1 &
          candidate_pid=$!
          trap 'kill "$baseline_pid" "$candidate_pid" 2>/dev/null || true' EXIT
          node test/performance/compare.mjs

      - name: Add comparison to run summary
        if: ${{ always() }}
        env:
          NEXTFLUX_REPORT: ${{ github.workspace }}/performance-results/comparison.md
        run: |
          if [ -f "$NEXTFLUX_REPORT" ]; then
            cat "$NEXTFLUX_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain raw values and concise comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextflux-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            performance-results/comparison.json
            performance-results/comparison.md
          if-no-files-found: warn
          retention-days: 14
