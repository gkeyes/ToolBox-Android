name: Finalize permission terminology
on:
  push:
    branches: ["codex/permission-resource-cleanup"]
    paths: [".github/workflows/permission-finalize-once.yml"]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'gkeyes/ToolBox-Android' && github.ref == 'refs/heads/codex/permission-resource-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Correct only reviewed documentation wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('docs/ToolBox_Android_技术方案.md')
          data = path.read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert digest == '5c1fb02683295d4008a8993221e9be7059575d17', 'Reviewed document changed'
          text = data.decode('utf-8')
          edits = {
              '   真实手势、速率和配额。': '   对应能力的前台/近期输入规则，以及在途资源和消息大小预算；不再按分钟计数。',
              '工具数量、KV 限额、速率、任务数量与\n响应大小是代码中的内部常量，不伪装成用户设置。': '资源预算用于保护消息、内存和并发，不作为另一层授权。\n当前不设 RPC 每分钟次数配额；其余保留预算及边界应在对应实现与文档中明确。',
              '                     ∧ rate/quota policy': '                     ∧ in-flight resource / message-size budget',
          }
          for old, new in edits.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'docs/ToolBox_Android_技术方案.md' || test "$(git -c core.quotePath=false diff --name-only)" = 'docs/ToolBox_Android_技术方案.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ToolBox_Android_技术方案.md
          git commit -m 'docs: remove stale minute-rate requirements from architecture overview'
          git push origin 'HEAD:codex/permission-resource-cleanup'
