name: TBX CI
run-name: TBX · ${{ inputs.tool || 'changed tools' }} · ${{ github.ref_name }}

on:
  push:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - "examples/**"
      - ".github/workflows/tbx.yml"
      - "scripts/ci/**"
      - "scripts/package-tool.py"
      - "scripts/package-examples.sh"
      - "sdk/**"
      - "tool-api/**"
      - "tool-package/**"
      - "tool-runtime/**"
      - "core-*/**"
      - "app/build.gradle.kts"
      - "app/src/main/kotlin/io/toolbox/host/runtime/**"
      - "app/src/main/kotlin/io/toolbox/host/permissions/**"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - "examples/**"
      - ".github/workflows/tbx.yml"
      - "scripts/ci/**"
      - "scripts/package-tool.py"
      - "scripts/package-examples.sh"
      - "sdk/**"
      - "tool-api/**"
      - "tool-package/**"
      - "tool-runtime/**"
      - "core-*/**"
      - "app/build.gradle.kts"
      - "app/src/main/kotlin/io/toolbox/host/runtime/**"
      - "app/src/main/kotlin/io/toolbox/host/permissions/**"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool directory name, comma-separated names, or all"
        type: string
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: tbx-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tool || 'changed' }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: targets
        env:
          TBX_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.tool || 'changed' }}
        run: python3 scripts/ci/tbx.py plan --tool "$TBX_SELECTION"
  package:
    name: TBX · ${{ matrix.tool }}
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - if: ${{ matrix.npm }}
        working-directory: examples/${{ matrix.tool }}
        run: npm ci --ignore-scripts
      - name: Watcher reliability regressions
        if: ${{ matrix.tool == 'github-actions-watcher' }}
        run: node --test scripts/tests/watcher-reliability.test.cjs
      - name: NextFlux reading unit tests
        if: ${{ matrix.tool == 'nextflux' }}
        working-directory: examples/nextflux
        run: npm test
      - name: Prepare NextFlux browser checks
        if: ${{ matrix.tool == 'nextflux' }}
        working-directory: examples/nextflux/test/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: NextFlux reading browser checks
        if: ${{ matrix.tool == 'nextflux' }}
        working-directory: examples/nextflux/test/browser
        run: npm test
      - name: Save NextFlux reading test results
        if: ${{ always() && matrix.tool == 'nextflux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextflux-reading-checks-${{ github.sha }}
          path: examples/nextflux/test/browser/test-results/reading-results.json
          if-no-files-found: warn
      - env:
          TBX_TOOL: ${{ matrix.tool }}
        run: python3 scripts/ci/tbx.py build --tool "$TBX_TOOL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.tool }}-${{ github.sha }}
          path: build/tbx/${{ matrix.tool }}/delivery/
          if-no-files-found: error
