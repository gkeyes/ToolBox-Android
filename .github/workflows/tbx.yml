name: TBX CI
run-name: TBX · ${{ inputs.tool || 'changed tools' }} · ${{ github.ref_name }}

on:
  push:
    branches: ["main"]
    paths:
      - "examples/**"
      - ".github/workflows/tbx.yml"
      - "scripts/ci/tbx.py"
      - "scripts/ci/tbx-targets.json"
      - "scripts/tests/bundled-tools.test.cjs"
      - "scripts/package-tool.py"
      - "scripts/package-examples.sh"
      - "sdk/**"
      - "tool-api/**"
      - "tool-package/**"
      - "tool-runtime/**"
      - "core-*/**"
      - "app/build.gradle.kts"
      - "app/src/main/kotlin/io/toolbox/host/runtime/**"
      - "app/src/main/kotlin/io/toolbox/host/permissions/**"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  pull_request:
    branches: ["main"]
    paths:
      - "examples/**"
      - ".github/workflows/tbx.yml"
      - "scripts/ci/tbx.py"
      - "scripts/ci/tbx-targets.json"
      - "scripts/tests/bundled-tools.test.cjs"
      - "scripts/package-tool.py"
      - "scripts/package-examples.sh"
      - "sdk/**"
      - "tool-api/**"
      - "tool-package/**"
      - "tool-runtime/**"
      - "core-*/**"
      - "app/build.gradle.kts"
      - "app/src/main/kotlin/io/toolbox/host/runtime/**"
      - "app/src/main/kotlin/io/toolbox/host/permissions/**"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool directory name, comma-separated names, or all"
        type: string
        required: true
        default: all
      validation_scope:
        description: "Run registered tests, selected test paths, or build only"
        type: choice
        options: [full, targeted, build]
        default: full
      test_filter:
        description: "For targeted runs: comma-separated test paths relative to the tool; tests are discovered from the globs in scripts/ci/tbx-targets.json"
        type: string
        required: false

permissions:
  contents: read

# A push only builds and publishes the tools its own commits changed, so a push run is never cancelled
# or replaced by a later one. PR and manual runs restart on a new commit.
concurrency:
  group: tbx-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tool || 'changed' }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # android.yml skips a change that only touches tbx.yml or tbx.py, so the guard tests for this workflow
      # and its scripts run here too.
      - name: Verify CI and packaging scripts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - id: targets
        env:
          TBX_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.tool || 'changed' }}
          TBX_VALIDATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope || 'targeted' }}
          TBX_TEST_FILTER: ${{ inputs.test_filter || '' }}
        run: python3 scripts/ci/tbx.py plan --tool "$TBX_SELECTION" --validation-scope "$TBX_VALIDATION_SCOPE" --test-filter "$TBX_TEST_FILTER"
  package:
    name: TBX · ${{ matrix.tool }}
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - if: ${{ matrix.npm }}
        working-directory: examples/${{ matrix.tool }}
        run: npm ci --ignore-scripts
      - name: Install RSS Scout test dependencies
        if: ${{ matrix.tool == 'rss-scout' && (matrix.full_tests || matrix.unit_test_filter != '') }}
        working-directory: examples/rss-scout
        run: npm ci --ignore-scripts
      - name: RSS Scout unit tests
        if: ${{ matrix.tool == 'rss-scout' && matrix.full_tests }}
        working-directory: examples/rss-scout
        run: npm test
      - name: Prepare watcher layout browser checks
        if: ${{ matrix.tool == 'github-actions-watcher' && (matrix.full_tests || matrix.watcher_layout) }}
        run: |
          python3 -m venv "$RUNNER_TEMP/watcher-layout-venv"
          "$RUNNER_TEMP/watcher-layout-venv/bin/python" -m pip install --disable-pip-version-check playwright==1.58.0
          "$RUNNER_TEMP/watcher-layout-venv/bin/python" -m playwright install --with-deps --only-shell chromium
      - name: Verify watcher layout and details interactions
        if: ${{ matrix.tool == 'github-actions-watcher' && (matrix.full_tests || matrix.watcher_layout) }}
        run: '"$RUNNER_TEMP/watcher-layout-venv/bin/python" examples/github-actions-watcher/tests/layout.py'
      - name: Save watcher layout evidence
        if: ${{ always() && matrix.tool == 'github-actions-watcher' && (matrix.full_tests || matrix.watcher_layout) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: watcher-layout-${{ github.sha }}
          path: build/watcher-layout/
          if-no-files-found: warn
          retention-days: 14
      - name: SocialCoach unit and corpus regressions
        if: ${{ matrix.tool == 'socialcoach' && matrix.full_tests }}
        working-directory: examples/socialcoach
        run: npm test
      - name: NextFlux reading unit tests
        if: ${{ matrix.tool == 'nextflux' && matrix.full_tests }}
        working-directory: examples/nextflux
        run: npm test
      - name: Registered unit tests
        # Every unit test the tool's globs in scripts/ci/tbx-targets.json discover; tools with an npm test
        # script run that instead, above.
        if: ${{ matrix.full_tests && matrix.unit_tests && !contains(fromJSON('["rss-scout","socialcoach","nextflux"]'), matrix.tool) }}
        env:
          TBX_TOOL: ${{ matrix.tool }}
        run: python3 scripts/ci/tbx.py test-unit --tool "$TBX_TOOL" --test-filter all
      - name: Verify selected tool unit cases
        if: ${{ !matrix.full_tests && matrix.unit_test_filter != '' }}
        env:
          TBX_TOOL: ${{ matrix.tool }}
          TBX_TEST_FILTER: ${{ matrix.unit_test_filter }}
        run: python3 scripts/ci/tbx.py test-unit --tool "$TBX_TOOL" --test-filter "$TBX_TEST_FILTER"
      - name: Prepare NextFlux browser checks
        if: ${{ matrix.tool == 'nextflux' && (matrix.full_tests || matrix.browser_test_filter != '') }}
        working-directory: examples/nextflux/test/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: NextFlux reading browser checks
        if: ${{ matrix.tool == 'nextflux' && matrix.full_tests }}
        working-directory: examples/nextflux/test/browser
        run: npm test
      - name: NextFlux selected browser cases
        if: ${{ matrix.tool == 'nextflux' && !matrix.full_tests && matrix.browser_test_filter != '' }}
        env:
          TBX_TEST_FILTER: ${{ matrix.browser_test_filter }}
        run: python3 scripts/ci/tbx.py test-browser --tool nextflux --test-filter "$TBX_TEST_FILTER"
      - name: Save NextFlux reading test results
        if: ${{ always() && matrix.tool == 'nextflux' && (matrix.full_tests || matrix.browser_test_filter != '') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextflux-reading-checks-${{ github.sha }}
          path: examples/nextflux/test/browser/test-results/reading-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and verify registered TBX
        env:
          TBX_TOOL: ${{ matrix.tool }}
        run: python3 scripts/ci/tbx.py build --tool "$TBX_TOOL"
      - name: Prepare SocialCoach browser checks
        if: ${{ matrix.tool == 'socialcoach' && (matrix.full_tests || matrix.browser_test_filter != '') }}
        working-directory: examples/socialcoach
        run: npx playwright install --with-deps chromium
      - name: Verify SocialCoach mobile and desktop interactions
        if: ${{ matrix.tool == 'socialcoach' && matrix.full_tests }}
        working-directory: examples/socialcoach
        run: npm run test:browser
      - name: Verify selected SocialCoach browser cases
        if: ${{ matrix.tool == 'socialcoach' && !matrix.full_tests && matrix.browser_test_filter != '' }}
        env:
          TBX_TEST_FILTER: ${{ matrix.browser_test_filter }}
        run: python3 scripts/ci/tbx.py test-browser --tool socialcoach --test-filter "$TBX_TEST_FILTER"
      - name: Save SocialCoach browser results
        if: ${{ always() && matrix.tool == 'socialcoach' && (matrix.full_tests || matrix.browser_test_filter != '') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: socialcoach-browser-${{ github.sha }}
          path: examples/socialcoach/test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.tool }}-${{ github.sha }}
          path: build/tbx/${{ matrix.tool }}/delivery/
          if-no-files-found: error
          retention-days: 14

  publish-test:
    name: Publish TBX to the in-app test channel
    needs: [select, package]
    # Tools that passed are published even if another tool in the matrix failed.
    if: ${{ always() && needs.select.result == 'success' && needs.select.outputs.count != '0' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    # No concurrency group: GitHub keeps only one waiting job per group, which would drop a middle run's
    # tools. Runs publish concurrently instead (each asset swap uses a run-specific temporary name), and
    # a run skips tools that a newer commit on main changed, so an older package never overwrites a newer one.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # Full history: the version check compares this push with the commit main was at before it.
          fetch-depth: 0
      - name: Publish the packages built by this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tbx"
          # Every package job that succeeded must hand over exactly its own package; a failed download is an
          # error, not "nothing to publish" (later pushes only rebuild the tools they change).
          succeeded="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "success") | .name | select(startswith("TBX · ")) | ltrimstr("TBX · ")')"
          if [ -z "$succeeded" ]; then
            echo "No package job succeeded; nothing to publish."
            exit 0
          fi
          for tool in $succeeded; do
            [[ "$tool" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "Unexpected tool name: $tool" >&2; exit 1; }
            gh run download "$GITHUB_RUN_ID" -n "$tool-$GITHUB_SHA" -D "$RUNNER_TEMP/artifacts/$tool"
            packages=("$RUNNER_TEMP/artifacts/$tool/$tool"-v*.tbx)
            [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ] \
              || { echo "The $tool package job succeeded, but its artifact has no single $tool .tbx" >&2; exit 1; }
            (cd "$RUNNER_TEMP/artifacts/$tool" && sha256sum -c SHA256SUMS.txt)
            cp "${packages[0]}" "$RUNNER_TEMP/tbx/"
          done
          # A push to main must raise the version of every tool whose shipped files it changed (the PR check
          # cannot see a version another PR merged after it ran). Such a tool is held back and the job fails
          # after publishing the others; a manual run has no previous commit to compare with.
          held=""
          if [ -n "$PUSH_BEFORE" ]; then
            for package in "$RUNNER_TEMP/tbx"/*.tbx; do
              tool="$(basename "$package")"
              tool="${tool%%-v[0-9]*}"
              if ! python3 scripts/ci/version_bump.py --push --base "$PUSH_BEFORE" --head "$GITHUB_SHA" --only "$tool" --quiet; then
                echo "Not publishing $(basename "$package"): it changed without a version bump." >&2
                rm -f "$package"
                held="$held $tool"
              fi
            done
          fi
          # Leave tools that later commits on main changed to those commits' own runs.
          newer="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" \
            --jq 'if .ahead_by == 0 then empty elif (.files | length) >= 300 then "scripts/ci/tbx.py" else .files[].filename end' \
            | python3 scripts/ci/tbx.py superseded)"
          for tool in $newer; do
            find "$RUNNER_TEMP/tbx" -name "$tool-v*.tbx" -print -delete | sed 's/^/Superseded by a newer commit: /'
          done
          bash scripts/ci/publish-test-release.sh tools "$RUNNER_TEMP/tbx"
          if [ -n "$held" ]; then
            echo "Held back without a version bump:$held" >&2
            exit 1
          fi
