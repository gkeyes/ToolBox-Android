name: Apply watcher notification layout change
on:
  push:
    branches: ["codex/fix-github-watcher-live-notification"]
    paths: [".github/workflows/watcher-layout-edit.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gkeyes/ToolBox-Android' && github.ref == 'refs/heads/codex/fix-github-watcher-live-notification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/fix-github-watcher-live-notification
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply only the reviewed notification changes
        shell: bash
        run: |
          set -euo pipefail
          base=b9b0e8b235a2e1ec17722f27781e3c9cadab80d6
          test "$(git ls-remote origin refs/heads/codex/refactor-lightweight-v2 | cut -f1)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = .github/workflows/watcher-layout-edit.yml
          python3 <<'PY'
          from pathlib import Path

          changed = set()
          def put(path, text):
              Path(path).write_text(text, encoding='utf-8')
              changed.add(path)
          def replace(path, old, new, count=1):
              text = Path(path).read_text(encoding='utf-8')
              assert text.count(old) == count, (path, old, text.count(old))
              put(path, text.replace(old, new))
          def section(path, start, end, new):
              text = Path(path).read_text(encoding='utf-8')
              assert text.count(start) == 1 and text.count(end) == 1, path
              a, b = text.index(start), text.index(end)
              assert a < b
              put(path, text[:a] + new + text[b:])

          model = 'examples/github-actions-watcher/github-model.js'
          section(model, '  function shortSha(run) {', '  return {\n    ACTIVE_STATUSES,', '''  function buildNotificationSummary(repoName, run, estimate, warning) {
              const presentation = statePresentation(run, warning);
              const estimatedProgress = Number(estimate?.progress);
              const progress = !run ? 0 : run.status === "completed" ? 100
                : clamp(Number.isFinite(estimatedProgress) ? Math.round(estimatedProgress) : 0, 0, 98);
              return {
                title: repoName,
                primaryText: `${progress}% · ${presentation.label}`,
                shortText: `${progress}%`,
                progress,
                ...presentation
              };
            }

          ''')
          app = 'examples/github-actions-watcher/app.js'
          replace(app, 'ToolBox-GitHub-Actions-Watcher/1.0.6', 'ToolBox-GitHub-Actions-Watcher/1.0.7')
          section(app, '  function liveRequestFor(run) {', '  async function updateLiveNotification() {', '''  function liveRequestFor(run) {
              const estimate = run ? calculateEstimate(run) : { progress: 0 };
              const warning = ["rate_limit", "offline"].includes(state.warning) ? state.warning : null;
              const summary = model.buildNotificationSummary(state.config.fullName, run, estimate, warning);
              return {
                sessionId: state.sessionId,
                title: cleanText(summary.title, 64),
                primaryText: cleanText(summary.primaryText, 32),
                shortText: cleanText(summary.shortText, 12),
                updatedAt: Date.now(),
                progress: summary.progress,
                accentColor: summary.color,
                tone: summary.tone
              };
            }

          ''')
          replace(app, '      state.warningMessage = `额度将在 ${formatClock(state.rateResetAt)} 恢复`;\n      renderDashboard();', '      state.warningMessage = `额度将在 ${formatClock(state.rateResetAt)} 恢复`;\n      await updateLiveNotification();\n      renderDashboard();')

          renderer = 'app/src/main/kotlin/io/toolbox/host/runtime/RuntimeLiveNotificationRenderer.kt'
          replace(renderer, 'listOfNotNull(request.primaryText, request.secondaryText).joinToString(" · ")', 'listOfNotNull(request.primaryText, request.secondaryText?.takeIf(String::isNotBlank)).joinToString(" · ")')
          replace(renderer, '        val body = live?.request?.body ?: content', '''        // An omitted live body means no expanded prose, not a copy of the status line.
                  val body = if (live == null) content else live.request.body?.takeIf(String::isNotBlank)''')
          replace(renderer, '            .setStyle(Notification.BigTextStyle().bigText(body))\n', '')
          replace(renderer, '            .setSubText(live?.request?.secondaryText)\n', '')
          replace(renderer, '            .apply {\n                live?.request?.progress?.let { setProgress(100, it, false) }', '''            .apply {
                          body?.let { setStyle(Notification.BigTextStyle().bigText(it)) }
                          live?.request?.secondaryText?.takeIf(String::isNotBlank)?.let { setSubText(it) }
                          live?.request?.progress?.let { setProgress(100, it, false) }''')
          replace(renderer, '        notificationBody: String,', '        notificationBody: String?,')
          replace(renderer, '        val displaySecondary = request.secondaryText', '''        val displaySecondary = request.secondaryText?.takeIf(String::isNotBlank)
                  val minimalContent = displaySecondary == null && notificationBody == null''')
          replace(renderer, '            title = displayValue\n            content = displayTitle', '            title = if (minimalContent) displayTitle else displayValue\n            content = if (minimalContent) displayValue else displayTitle', count=2)
          replace(renderer, '            extraTitle = request.updatedAt?.let(::formatTime)', '            extraTitle = if (minimalContent) null else request.updatedAt?.let(::formatTime)')
          replace(renderer, '        island {\n', '''        if (minimalContent) {
                      request.progress?.let { value ->
                          multiProgressInfo {
                              progress = value
                              color = accentHex
                              points = 0
                          }
                      }
                  }
                  island {
          ''')
          replace(renderer, '''                    title = displayValue
                              frontTitle = displayTitle.take(16)
                              content = displaySecondary'''.replace('                              ', '                    '), '''                    title = if (minimalContent) displayTitle else displayValue
                              frontTitle = if (minimalContent) null else displayTitle.take(16)
                              content = if (minimalContent) displayValue else displaySecondary'''.replace('                              ', '                    '))
          replace(renderer, '                    narrowFont = true\n                    isTitleDigit = displayValue.any(Char::isDigit)', '                    narrowFont = !minimalContent\n                    isTitleDigit = !minimalContent && displayValue.any(Char::isDigit)')

          mt = 'examples/github-actions-watcher/github-model.test.js'
          section(mt, 'test("notification summary has one coherent job and step line",', 'test("failure, cancellation, rate limit and offline map to stable colors",', '''test("live summary has only repository, percentage/status and matching progress in every state", () => {
            const details = { name: "Android CI", head_branch: "feature/private", head_sha: "abcdef123456" };
            const estimate = { progress: 65, job: "verify", step: "unit tests", elapsedMs: 1000, remainingMs: 3000 };
            const scenarios = [
              [null, null, 0, "等待构建"],
              [{ status: "in_progress" }, null, 65, "运行中"],
              ...["queued", "waiting", "pending", "requested"].map(status => [{ status }, null, 65, "排队中"]),
              [{ status: "completed", conclusion: "success" }, null, 100, "构建成功"],
              [{ status: "completed", conclusion: "failure" }, null, 100, "构建失败"],
              [{ status: "completed", conclusion: "cancelled" }, null, 100, "已取消"],
              [{ status: "completed", conclusion: "timed_out" }, null, 100, "构建超时"],
              [{ status: "in_progress" }, "offline", 65, "网络离线"],
              [{ status: "in_progress" }, "rate_limit", 65, "限流等待"],
              [null, "offline", 0, "网络离线"],
              [null, "rate_limit", 0, "限流等待"]
            ];
            for (const [state, warning, progress, label] of scenarios) {
              const run = state && { ...details, ...state };
              const summary = model.buildNotificationSummary("owner/repo", run, estimate, warning);
              assert.deepEqual(summary, {
                title: "owner/repo", primaryText: `${progress}% · ${label}`, shortText: `${progress}%`,
                progress, ...model.statePresentation(run, warning)
              });
              assert.equal(Object.hasOwn(summary, "secondaryText"), false);
              assert.equal(Object.hasOwn(summary, "body"), false);
            }
          });

          test("live percentage is a finite integer shared by text and bar, with terminal precedence", () => {
            for (const [input, expected] of [[64.6, 65], [-1, 0], [150, 98], [NaN, 0], [undefined, 0]]) {
              const summary = model.buildNotificationSummary("owner/repo", { status: "in_progress" }, { progress: input });
              assert.equal(summary.progress, expected);
              assert.equal(summary.primaryText, `${expected}% · 运行中`);
              assert.equal(summary.shortText, `${expected}%`);
            }
            const completed = model.buildNotificationSummary("owner/repo", { status: "completed", conclusion: "failure" }, { progress: 42 });
            assert.equal(completed.progress, 100);
            assert.equal(completed.primaryText, "100% · 构建失败");
          });

          ''')

          at = 'examples/github-actions-watcher/app.test.js'
          replace(at, '  const requests = [];\n  const secure = options.secure', '  const requests = [];\n  const liveCalls = [];\n  const secure = options.secure')
          replace(at, '      if (remote.requestError) throw remote.requestError;\n      let data;', '      if (remote.requestError) throw remote.requestError;\n      if (remote.response) return remote.response;\n      let data;')
          replace(at, '    notifications: { post: async () => {}, live: { start: async () => {}, update: async () => {}, end: async () => {} } },', '''    notifications: { post: async () => {}, live: {
                start: async request => { liveCalls.push({ method: "start", request: structuredClone(request) }); },
                update: async request => { liveCalls.push({ method: "update", request: structuredClone(request) }); },
                end: async () => {},
              } },''')
          replace(at, '    node, snapshot: () => structuredClone(saved),', '''    node, snapshot: () => structuredClone(saved),
              liveCalls: () => structuredClone(liveCalls),
              backgroundTick: async milliseconds => {
                now += milliseconds;
                timerListener({ key: "github-actions-watcher-clock" });
                await flush();
              },''')
          put(at, Path(at).read_text() + '''
          function assertMinimalLiveRequest(request, label, progress = request.progress) {
            assert.deepEqual(Object.keys(request).sort(), [
              "accentColor", "primaryText", "progress", "sessionId", "shortText", "title", "tone", "updatedAt"
            ].sort());
            assert.equal(request.sessionId, "fixture-session");
            assert.equal(request.title, "fixture/repo");
            assert.equal(request.primaryText, `${progress}% · ${label}`);
            assert.equal(request.progress, progress);
            assert.equal(request.shortText, `${progress}%`);
            assert.ok(Number.isInteger(progress) && progress >= 0 && progress <= 100);
          }

          test("actual live start and background updates keep the minimal layout without app overrides", async () => {
            const app = await monitoringApp({ run: activeRun, jobs: activeJobs });
            assert.equal(app.liveCalls()[0].method, "start");
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "运行中");
            const requests = app.requestCount();
            const calls = app.liveCalls().length;
            await app.backgroundTick(10_000);
            assert.equal(app.requestCount(), requests, "clock updates must not fetch GitHub");
            assert.equal(app.liveCalls().length, calls + 1);
            assert.equal(app.liveCalls().at(-1).method, "update");
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "运行中", app.snapshot().progressByRun[model.runKey(activeRun)]);
            assert.match(app.node("job-list").textContent, /Set up Android SDK 37/);
          });

          test("actual queued/waiting and terminal notifications share the same percentage/status layout", async () => {
            for (const status of ["queued", "waiting", "pending", "requested"]) {
              const app = await monitoringApp({ run: { ...activeRun, status }, jobs: [] });
              assertMinimalLiveRequest(app.liveCalls().at(-1).request, "排队中");
            }
            for (const [conclusion, label, tone] of [
              ["success", "构建成功", "positive"], ["failure", "构建失败", "negative"],
              ["cancelled", "已取消", "neutral"], ["timed_out", "构建超时", "negative"]
            ]) {
              const remote = { run: activeRun, jobs: activeJobs };
              const app = await monitoringApp(remote);
              remote.run = { ...activeRun, status: "completed", conclusion, updated_at: "2026-09-03T08:06:05Z" };
              remote.jobs = completedJobs(conclusion);
              await app.poll();
              const last = app.liveCalls().at(-1);
              assert.equal(last.method, "update");
              assertMinimalLiveRequest(last.request, label, 100);
              assert.equal(last.request.tone, tone);
              assert.match(app.node("job-list").textContent, /Set up Android SDK 37/);
            }
          });

          test("offline and rate-limit warnings replace the status, survive clock ticks and recover", async () => {
            const remote = { run: activeRun, jobs: activeJobs };
            const app = await monitoringApp(remote);
            remote.requestError = Object.assign(new Error("fixture offline"), { code: "NETWORK_UNAVAILABLE" });
            await app.poll();
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "网络离线");
            assert.equal(app.liveCalls().at(-1).request.tone, "warning");
            await app.backgroundTick(10_000);
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "网络离线");
            remote.requestError = null;
            remote.response = {
              status: 403,
              headers: { "x-ratelimit-remaining": "0", "x-ratelimit-reset": String(Date.parse("2026-09-03T08:07:00Z") / 1000) },
              body: JSON.stringify({ message: "API rate limit exceeded" })
            };
            await app.poll();
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "限流等待");
            const requests = app.requestCount();
            const calls = app.liveCalls().length;
            await app.refresh();
            assert.equal(app.requestCount(), requests, "known rate-limit window must not make another request");
            assert.equal(app.liveCalls().length, calls + 1, "the fast path must also refresh the warning");
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "限流等待");
            await app.backgroundTick(10_000);
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "限流等待");
            remote.response = null;
            await app.tick(60_000);
            await app.poll();
            assertMinimalLiveRequest(app.liveCalls().at(-1).request, "运行中");
            assert.equal(app.liveCalls().at(-1).request.tone, "neutral");
          });
          ''')

          kt = 'app/src/androidTest/kotlin/io/toolbox/host/runtime/RuntimeLiveNotificationRendererTest.kt'
          tests = '''    @Test
              fun minimalLiveContentKeepsTitleStatusAndProgressWithoutInventingOptionalRows() {
                  val context = InstrumentationRegistry.getInstrumentation().targetContext
                  val renderer = RuntimeLiveNotificationRenderer(context)
                  // Deliberately not the watcher ID: omission semantics belong to the generic renderer.
                  val session = RuntimeBackgroundSessionUi("minimal-session", "io.example.generic", "其他工具", 1L, 0x550010)
                  val open = RuntimeForegroundService.openSessionPendingIntent(context, session.toolId, session.sessionId)
                  val stop = RuntimeForegroundService.stopSessionPendingIntent(context, session.toolId, session.sessionId)
                  val states = listOf(
                      Triple(0, "排队中", RuntimeLiveNotificationTone.NEUTRAL),
                      Triple(65, "运行中", RuntimeLiveNotificationTone.NEUTRAL),
                      Triple(100, "构建成功", RuntimeLiveNotificationTone.POSITIVE),
                      Triple(100, "构建失败", RuntimeLiveNotificationTone.NEGATIVE),
                      Triple(100, "已取消", RuntimeLiveNotificationTone.NEUTRAL),
                      Triple(65, "网络离线", RuntimeLiveNotificationTone.WARNING),
                      Triple(65, "限流等待", RuntimeLiveNotificationTone.WARNING),
                  )
                  try {
                      listOf(false, true).forEach { hyperOs ->
                          val support = LiveNotificationSupportState(if (hyperOs) 3 else 0, hyperOs, false, hyperOs, hyperOs)
                          states.forEach { (progress, label, tone) ->
                              val primary = "$progress% · $label"
                              val request = RuntimeLiveNotificationRequest(
                                  sessionId = session.sessionId, title = "owner/repo", primaryText = primary,
                                  secondaryText = null, body = null, shortText = "$progress%", updatedAt = 1L,
                                  progress = progress, accentColor = null, tone = tone,
                              )
                              val live = RuntimeLiveNotificationUi(session.toolId, session.toolName, request, 1L, 2L)
                              // Build rich then minimal content for the same session to catch stale expanded rows.
                              val rich = live.copy(request = request.copy(secondaryText = "附加信息", body = "明确提供的正文"))
                              val richNotification = parcelCopy(renderer.build(RuntimeNotificationCard(session, rich), support, open, stop))
                              assertEquals("明确提供的正文", richNotification.extras.getCharSequence(Notification.EXTRA_BIG_TEXT).toString())
                              assertEquals("$primary · 附加信息", richNotification.extras.getCharSequence(Notification.EXTRA_TEXT).toString())
                              assertEquals("附加信息", richNotification.extras.getCharSequence(Notification.EXTRA_SUB_TEXT).toString())
                              if (hyperOs) {
                                  val richPayload = JSONObject(checkNotNull(richNotification.extras.getString("miui.focus.param"))).getJSONObject("param_v2")
                                  assertEquals(primary, richPayload.getJSONObject("baseInfo").getString("title"))
                                  assertEquals("owner/repo", richPayload.getJSONObject("baseInfo").getString("content"))
                                  assertEquals("明确提供的正文", richPayload.getJSONObject("iconTextInfo").getString("subContent"))
                              }
                              val notification = parcelCopy(renderer.build(RuntimeNotificationCard(session, live), support, open, stop))
                              assertEquals("owner/repo", notification.extras.getCharSequence(Notification.EXTRA_TITLE).toString())
                              assertEquals(primary, notification.extras.getCharSequence(Notification.EXTRA_TEXT).toString())
                              assertNull(notification.extras.getCharSequence(Notification.EXTRA_BIG_TEXT))
                              assertNull(notification.extras.getCharSequence(Notification.EXTRA_SUB_TEXT))
                              assertNull(notification.extras.getString(Notification.EXTRA_TEMPLATE))
                              assertEquals(progress, notification.extras.getInt(Notification.EXTRA_PROGRESS))
                              assertEquals(100, notification.extras.getInt(Notification.EXTRA_PROGRESS_MAX))
                              assertFalse(notification.extras.getBoolean(Notification.EXTRA_PROGRESS_INDETERMINATE))
                              assertEquals(open, notification.contentIntent)
                              assertEquals(listOf("打开", "停止当前"), notification.actions.map { it.title.toString() })
                              assertEquals(listOf(open, stop), notification.actions.map { it.actionIntent })
                              assertTrue(notification.flags and Notification.FLAG_ONGOING_EVENT != 0)
                              if (hyperOs) {
                                  val payload = JSONObject(checkNotNull(notification.extras.getString("miui.focus.param"))).getJSONObject("param_v2")
                                  listOf("baseInfo", "iconTextInfo").forEach { name ->
                                      val info = payload.getJSONObject(name)
                                      assertEquals("owner/repo", info.getString("title"))
                                      assertEquals(primary, info.getString("content"))
                                      listOf("subTitle", "subContent", "extraTitle").forEach { assertTrue(info.isNull(it)) }
                                  }
                                  val bar = payload.getJSONObject("multiProgressInfo")
                                  assertEquals(progress, bar.getInt("progress"))
                                  assertEquals(0, bar.getInt("points"))
                                  listOf("title", "content", "subTitle", "subContent").forEach { assertTrue(bar.isNull(it)) }
                              } else {
                                  assertNull(notification.extras.getString("miui.focus.param"))
                              }
                              // Explicit secondary text must not cause a missing body to be fabricated either.
                              val secondaryOnly = live.copy(request = request.copy(secondaryText = "附加信息"))
                              val secondaryNotification = parcelCopy(renderer.build(RuntimeNotificationCard(session, secondaryOnly), support, open, stop))
                              assertNull(secondaryNotification.extras.getCharSequence(Notification.EXTRA_BIG_TEXT))
                              assertEquals("$primary · 附加信息", secondaryNotification.extras.getCharSequence(Notification.EXTRA_TEXT).toString())
                          }
                      }
                  } finally {
                      open.cancel()
                      stop.cancel()
                  }
              }

          '''
          replace(kt, '    private fun assertNoForcedFocusForeground(payload: JSONObject) {', tests + '    private fun assertNoForcedFocusForeground(payload: JSONObject) {')

          # Keep declaration and in-app manual aligned; no new wire fields or permission changes.
          replace('sdk/toolbox-api.d.ts', '  readonly secondaryText?: string;\n  readonly body?: string;', '''  /** Optional supplementary text; omit together with body for a title-first minimal live card (host 0.7.5+). */
            readonly secondaryText?: string;
            /** Optional expanded prose. Host 0.7.5+ does not repeat primaryText when this is omitted. */
            readonly body?: string;''')
          replace('sdk/help/manual.md', '- secondaryText：最多 96 个字符；body：最多 256 个字符。', '''- secondaryText：最多 96 个字符；body：最多 256 个字符。
          - ToolBox 0.7.5 起，省略 body 不会自动重复状态正文；同时省略 secondaryText 与 body 时，普通通知及 HyperOS 卡片按 title、primaryText、可选 progress 排列，不补充底行或额外时间。显式提供的附加信息仍保留。shortText 仅用于独立的紧凑摘要。''')

          replace('app/build.gradle.kts', 'versionCode = 28', 'versionCode = 29')
          replace('app/build.gradle.kts', 'versionName = "0.7.4"', 'versionName = "0.7.5"')
          for path in ['README.md', 'docs/ToolBox_Android_技术方案.md']:
              replace(path, '0.7.4 (28)', '0.7.5 (29)')
          manifest = 'examples/github-actions-watcher/manifest.json'
          replace(manifest, '"version": "1.0.6"', '"version": "1.0.7"')
          replace(manifest, '"versionCode": 7', '"versionCode": 8')
          replace(manifest, '"minHostVersion": "0.3.5"', '"minHostVersion": "0.7.5"')
          replace('examples/github-actions-watcher/package.sh', 'github-actions-watcher-v1.0.6.tbx', 'github-actions-watcher-v1.0.7.tbx')
          readme = 'examples/github-actions-watcher/README.md'
          replace(readme, '1.0.6 需要 ToolBox 0.3.5 或更新版本。', '1.0.7 需要 ToolBox 0.7.5 或更新版本。')
          replace(readme, '## 能力\n', '''## 实时通知

          实时卡片只包含仓库全名（owner/repo）、“百分比 · 状态”和同值进度条；不展示 workflow、job/step、分支、SHA、耗时或剩余时间。离线和限流警示替换这一行的状态，不追加重复底行。终态 100% 表示本次构建已结束，成功、失败和取消仍由状态文字区分。

          工具内详情、后台轮询、终态保留窗口、独立结果通知以及打开/停止操作不变。旧宿主会补出正文，因此此版声明最低宿主 0.7.5；自动截图测试保持退役，HyperOS 设备上的最终展示仍需人工验证。

          ## 能力
          ''')
          replace(readme, 'github-actions-watcher-v1.0.6.tbx', 'github-actions-watcher-v1.0.7.tbx')
          catalog = 'examples/README.md'
          replace(catalog, '可以使用 ToolBox 0.6.7 导入下表各包；', '请按下表最低 ToolBox 版本选择宿主；')
          replace(catalog, '| GitHub 构建守望 | 1.0.6 | 0.3.5 | GitHub Actions 构建进度 | [下载](packages/github-actions-watcher-v1.0.6.tbx) · [源码](github-actions-watcher/) |', '| GitHub 构建守望 | 1.0.7 | 0.7.5 | GitHub Actions 三层实时进度通知 | [CI 产物](https://github.com/gkeyes/ToolBox-Android/actions/workflows/tbx.yml) · [源码](github-actions-watcher/) · [旧版 1.0.6](packages/github-actions-watcher-v1.0.6.tbx) |')

          ci = '.github/workflows/android.yml'
          text = Path(ci).read_text()
          assert '0.7.4' in text
          put(ci, text.replace('0.7.4', '0.7.5'))
          replace(ci, "versionCode='28'", "versionCode='29'")
          replace(ci, 'VERSION_CODE=28', 'VERSION_CODE=29')
          replace(ci, 'io.toolbox.host.runtime.BrowserLauncherInstrumentedTest,', 'io.toolbox.host.runtime.RuntimeLiveNotificationRendererTest,io.toolbox.host.runtime.BrowserLauncherInstrumentedTest,')
          replace(ci, 'LIVE_NOTIFICATION_COLOR_REGRESSION=COMPILED_NOT_RUN_USER_OWNED', 'LIVE_NOTIFICATION_COLOR_REGRESSION=PASS')
          replace(ci, "            printf 'LIVE_NOTIFICATION_HIDING=SYSTEM_DEFAULT\\n'", "            printf 'LIVE_NOTIFICATION_CONTENT_LAYOUT_GITHUB_EMULATOR=PASS\\n'\n            printf 'LIVE_NOTIFICATION_HIDING=SYSTEM_DEFAULT\\n'")

          # Remove the common indentation used to embed source additions in this one-shot workflow.
          # Only inserted snippets carry ten surplus spaces; normalize them explicitly by file/region below.
          for path in changed:
              text = Path(path).read_text()
              # Python heredoc is YAML-dedented, so snippet continuations above retain their source indentation.
              # No global code reformatting or unrelated content replacement is performed.
              Path(path).write_text(text, encoding='utf-8')
          Path('/tmp/watcher-changed-files.txt').write_text('\n'.join(sorted(changed)) + '\n')
          print('Scoped changed files:\n' + '\n'.join(sorted(changed)))
          PY
      - name: Verify watcher behavior on GitHub
        shell: bash
        run: |
          set -euo pipefail
          node --check examples/github-actions-watcher/github-model.js
          node --check examples/github-actions-watcher/app.js
          node --test examples/github-actions-watcher/github-model.test.js examples/github-actions-watcher/app.test.js
          git diff --check
      - name: Commit only this branch and retire the temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/fix-github-watcher-live-notification
          git diff --name-only | sort > /tmp/watcher-actual-files.txt
          diff -u /tmp/watcher-changed-files.txt /tmp/watcher-actual-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/watcher-changed-files.txt
          git rm -- .github/workflows/watcher-layout-edit.yml
          git commit -m 'fix: simplify GitHub watcher live notifications to three layers'
          git push origin HEAD:refs/heads/codex/fix-github-watcher-live-notification
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
