name: TBX upgrade regression

on:
  push:
    branches: ["fix/tbx-update-credential-retention"]
  pull_request:
    paths:
      - "app/**"
      - "tool-package/**"
      - "tool-runtime/**"
      - "core-data/**"
      - ".github/workflows/tbx-upgrade.yml"
      - "scripts/ci/verify-tbx-process.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbx-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Production host update persistence
    if: ${{ !contains(github.event.head_commit.message, '[apply-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Compile and run existing protocol security and admitted unit gates
        run: bash scripts/qa/run-host-gate.sh --attempt "$GITHUB_WORKSPACE/build/tbx-upgrade-gate"
      - name: Compile instrumentation packages
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :core-data:assembleDebugAndroidTest
      - name: Validate client persistence without contacting real services
        run: |
          node --test examples/github-actions-watcher/app.test.js
          npm ci --prefix examples/nextflux --ignore-scripts
          node --test examples/nextflux/test/network.test.mjs
          node scripts/check-developer-help.mjs
      - name: Enable runner KVM
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual host Room Keystore WebView and process restart regressions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.host.runtime.TbxUpgradePersistenceTest,io.toolbox.host.runtime.TbxUpgradeRuntimeTest,io.toolbox.host.runtime.RuntimeStandardStorageInstrumentedTest
            ./gradlew --no-daemon :core-data:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.core.data.FreshPersistenceContractTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/ci/verify-tbx-process.sh
      - name: Retain actual results including failed compilation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tbx-upgrade-results-${{ github.sha }}
          path: |
            build/tbx-upgrade-gate/
            build/tbx-upgrade-process/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            core-data/build/outputs/androidTest-results/connected/
            **/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Stable signed host APK
    needs: regression
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Restore existing stable signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]
          signing_file="$RUNNER_TEMP/toolbox-signing.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          keytool -list -keystore "$signing_file" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          printf 'TOOLBOX_SIGNING_STORE_FILE=%s\n' "$signing_file" >> "$GITHUB_ENV"
      - name: Assemble optimized release with existing signing configuration
        env:
          TOOLBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          TOOLBOX_SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          TOOLBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify identity certificate and write limited factual delivery receipt
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='io.toolbox.host' versionCode='30' versionName='0.7.6'" "$RUNNER_TEMP/badging.txt"
          ! grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"
          grep -Fx 'io.toolbox.host.background.ToolBoxBackgroundWorker -> io.toolbox.host.background.ToolBoxBackgroundWorker:' app/build/outputs/mapping/release/mapping.txt
          expected="$(keytool -exportcert -keystore "$TOOLBOX_SIGNING_STORE_FILE" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" 2>/dev/null | sha256sum | awk '{print $1}')"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest: / {sub(/^.*certificate SHA-256 digest: /, ""); if (!found++) print}')"
          [[ -n "$expected" && "$actual" == "$expected" ]]
          mkdir -p build/tbx-upgrade-delivery
          cp "$apk" build/tbx-upgrade-delivery/toolbox-v0.7.6-release.apk
          {
            printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_RUN=%s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'VERSION_NAME=0.7.6\nVERSION_CODE=30\nAPPLICATION_ID=io.toolbox.host\nBUILD_TYPE=release\n'
            printf 'APK_CERT_SHA256=%s\n' "$actual"
            printf 'APK_DEBUGGABLE=false\nR8=PASS\nSTABLE_CERT_MATCH=PASS\n'
            printf 'HOST_GATE=PASS\nPRODUCTION_HOST_UPGRADE_API35_EMULATOR=PASS\nROOM_PERSISTENCE_API35_EMULATOR=PASS\n'
            printf 'BRIDGE_LOGIN_PROCESS_RESTART_API35_EMULATOR=PASS\nSCREENSHOT_TESTING=REMOVED_BY_USER_REQUEST\n'
            printf 'REAL_DEVICE=NOT_RUN\nREAL_SERVER_LOGIN=NOT_RUN\nMINIFIED_RUNTIME_EXECUTION=NOT_RUN\n'
            printf 'INSTALL_ORDER=Update host APK before importing newer TBX\nDELETED_OLD_KEYS_OR_CIPHERTEXT=NOT_RECOVERABLE_BY_PATCH\n'
          } > build/tbx-upgrade-delivery/BUILD_AND_TEST_RECEIPT.txt
          (cd build/tbx-upgrade-delivery && sha256sum toolbox-v0.7.6-release.apk BUILD_AND_TEST_RECEIPT.txt > SHA256SUMS.txt)
      - name: Upload APK without publishing a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbox-v0.7.6-credential-fix-${{ github.sha }}
          path: build/tbx-upgrade-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Remove runner signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/toolbox-signing.p12"
