name: TBX upgrade regression

on:
  push:
    branches: ["fix/tbx-update-credential-retention"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbx-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Retain exact source for upgrade diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/tbx-upgrade-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tbx-upgrade-source-${{ github.sha }}
          path: ${{ runner.temp }}/tbx-upgrade-source.tar.gz
          if-no-files-found: error
          retention-days: 3
