name: Backup restore and TBX theme verification

on:
  push:
    branches: ["codex/backup-restore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Record exact reviewed source
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive --format=zip --output=source.zip HEAD
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile and run unit and contract tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon verifySecurityInvariants :tool-api:verifyToolBoxApiContract :app:assembleDebug :app:compileDebugAndroidTestKotlin :core-data:compileDebugAndroidTestKotlin :app:testDebugUnitTest :core-data:testDebugUnitTest :tool-package:testDebugUnitTest :tool-runtime:testDebugUnitTest 2>&1 | tee android-build.log
      - name: Enable runner KVM
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual backup and WebView behavior without screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.host.backup.HostBackupServiceTest,io.toolbox.host.backup.BackupScreenTest,io.toolbox.host.runtime.RuntimeThemeInheritanceTest,io.toolbox.host.runtime.TbxUpgradePersistenceTest,io.toolbox.host.runtime.RuntimeStandardStorageInstrumentedTest
            ./gradlew --no-daemon :core-data:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.core.data.FreshPersistenceContractTest
      - name: Preserve source APK and validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-android-${{ github.sha }}
          path: |
            source.zip
            source-sha.txt
            android-build.log
            app/build/outputs/apk/debug/
            app/build/test-results/
            core-data/build/test-results/
            tool-package/build/test-results/
            tool-runtime/build/test-results/
            app/build/outputs/androidTest-results/connected/
            core-data/build/outputs/androidTest-results/connected/
          if-no-files-found: error
          retention-days: 14

  nextflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/nextflux/package-lock.json
      - name: Test build and package NextFlux
        working-directory: examples/nextflux
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee ../../nextflux-unit.log
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test theme-inheritance.spec.mjs
          python3 package.py
      - name: Preserve NextFlux package and behavior evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-nextflux-${{ github.sha }}
          path: |
            build/nextflux/*.tbx
            nextflux-unit.log
            examples/nextflux/test-results/results.json
          if-no-files-found: warn
          retention-days: 14
