name: NextFlux v27 article regression
on:
  push:
    paths:
      - .github/workflows/nextflux-v27-regression.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/nextflux/package-lock.json
      - working-directory: examples/nextflux
        run: npm ci --ignore-scripts
      - name: Run v27 extractor against article
        working-directory: examples/nextflux
        env:
          ARTICLE_URL: https://cn.nytimes.com/world/20260925/trump-xi-state-dinner-menu/
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import { parseHTML } from "linkedom";
          import { extractWithDefuddle } from "./src/reading/extractors/defuddle.mjs";
          import { analyzeArticle, scoreArticle } from "./src/reading/analyze.mjs";

          const response=await fetch(process.env.ARTICLE_URL,{
            headers:{
              "User-Agent":"Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
              "Accept":"text/html,application/xhtml+xml;q=0.9,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh;q=0.9,en;q=0.5"
            }
          });
          const html=await response.text();
          const {document}=parseHTML(html);
          globalThis.DOMParser=class {
            parseFromString(source){ return parseHTML(source).document; }
          };
          const extracted=extractWithDefuddle({html,url:response.url});
          const analysis=analyzeArticle(extracted.content);
          const report={
            status:response.status,
            rawBytes:Buffer.byteLength(html),
            raw:{p:document.querySelectorAll("p").length,figure:document.querySelectorAll("figure").length,figcaption:document.querySelectorAll("figcaption").length},
            extracted:{
              source:extracted.source,
              metadata:extracted.metadata,
              score:scoreArticle(analysis),
              analysis,
              tags:{
                p:(extracted.content.match(/<p\b/gi)||[]).length,
                h:(extracted.content.match(/<h[1-6]\b/gi)||[]).length,
                figure:(extracted.content.match(/<figure\b/gi)||[]).length,
                figcaption:(extracted.content.match(/<figcaption\b/gi)||[]).length,
                img:(extracted.content.match(/<img\b/gi)||[]).length,
                li:(extracted.content.match(/<li\b/gi)||[]).length
              },
              sample:extracted.content.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,800)
            }
          };
          console.log(JSON.stringify(report,null,2));
          fs.writeFileSync("v27-regression.json",JSON.stringify(report,null,2));
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nextflux-v27-article-regression
          path: examples/nextflux/v27-regression.json
