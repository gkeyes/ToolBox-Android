name: SocialCoach TBX
run-name: SocialCoach 1.0.2 · ${{ github.ref_name }}

on:
  push:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - ".github/workflows/socialcoach.yml"
      - "examples/socialcoach/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socialcoach-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/socialcoach/package-lock.json
      - name: Install locked dependencies
        working-directory: examples/socialcoach
        run: npm ci --ignore-scripts
      - name: Record exact source commit
        run: |
          mkdir -p build/socialcoach
          git rev-parse HEAD > build/socialcoach/SOURCE_COMMIT.txt
      - name: Unit and upstream corpus regressions
        working-directory: examples/socialcoach
        run: |
          set -o pipefail
          npm test | tee ../../build/socialcoach/unit-tests.txt
      - name: Type check and static React build
        working-directory: examples/socialcoach
        run: npm run build
      - name: Install browser for mobile and desktop checks
        working-directory: examples/socialcoach
        run: npx playwright install --with-deps chromium
      - name: Browser interaction regressions
        working-directory: examples/socialcoach
        run: npm run test:browser
      - name: Package and verify TBX
        run: |
          python3 scripts/package-tool.py examples/socialcoach/dist build/socialcoach/socialcoach-v1.0.2.tbx
          python3 - <<'PY'
          import pathlib,zipfile,json,hashlib
          p=pathlib.Path('build/socialcoach/socialcoach-v1.0.2.tbx')
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('manifest.json')); h=json.loads(z.read('integrity.json'))
              assert m['version']=='1.0.2' and m['versionCode']==3 and m['entry'] in z.namelist()
              assert not any(pathlib.Path(n).suffix.lower() in {'.woff','.woff2','.ttf','.otf'} for n in z.namelist())
              for name,digest in h['files'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
          (p.parent/'SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Collect source and test evidence
        if: always()
        run: |
          mkdir -p build/socialcoach/evidence
          if [ -d examples/socialcoach/test-results ]; then cp -r examples/socialcoach/test-results build/socialcoach/evidence/; fi
          tar --exclude=node_modules --exclude=dist --exclude=test-results --exclude=__pycache__ -czf build/socialcoach/source-workspace.tar.gz -C examples socialcoach
          if [ -d examples/socialcoach/dist ]; then tar -czf build/socialcoach/preview.tar.gz -C examples/socialcoach dist; fi
      - name: Save deliverable and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: socialcoach-1.0.2-${{ github.run_attempt }}
          path: build/socialcoach/
          if-no-files-found: error
          retention-days: 30
