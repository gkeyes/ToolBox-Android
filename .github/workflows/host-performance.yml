name: Compare signed host builds on one emulator
on:
  push:
    branches: [main]
    paths:
      - scripts/bench/host-comparison.json
      - scripts/bench/android-startup.py
      - scripts/bench/compare-emulator.sh
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline signed Android CI commit SHA
        type: string
      candidate:
        description: Candidate signed Android CI commit SHA
        type: string
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retrieve signed APKs from their original verified main builds
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ inputs.baseline }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          for edition in baseline candidate; do
            if [[ "$edition" == baseline ]]; then sha="$BASELINE_SHA"; else sha="$CANDIDATE_SHA"; fi
            sha="${sha:-$(jq -r --arg k "$edition" '.[$k]' scripts/bench/host-comparison.json)}"
            if [[ "$edition" == candidate && "$sha" == self ]]; then sha="$GITHUB_SHA"; fi
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            for attempt in {1..10}; do
              run=$(gh run list --workflow android.yml --branch main --event push --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId')
              [[ -n "$run" ]] && break
              sleep 6
            done
            test -n "$run"
            gh run watch "$run" --interval 30
            gh run download "$run" -p "toolbox-v*-release-$sha" -D "build/comparison/$edition"
            mapfile -t apks < <(find "build/comparison/$edition" -name '*-release.apk')
            test "${#apks[@]}" -eq 1
            receipt="$(dirname "${apks[0]}")/BUILD_RECEIPT.txt"
            grep -Fxq "BUILD_COMMIT=$sha" "$receipt"
            grep -Fxq "HOST_VERIFY_JOB=success" "$receipt"
            grep -Fxq "ORIGINAL_CERTIFICATE_MATCH=PASS" "$receipt"
            cp "${apks[0]}" "build/comparison/$edition.apk"
          done
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM and install the system image
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash scripts/ci/install-emulator.sh 35 google_apis x86_64
      - name: Compare cold launches and verify the in-place upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/bench/compare-emulator.sh
      - name: Retain the individual cold starts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-cold-start-comparison
          path: build/comparison/evidence/
