name: Publish release
run-name: Publish ${{ inputs.tag }} from run ${{ inputs.run_id }}

# Manual only: creates a release at the commit an Android CI run built, attaches that run's
# verified signed delivery, carries over unchanged TBX packages from an earlier release, and publishes it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag, e.g. v0.8.31 (must match the APK version)"
        type: string
        required: true
      run_id:
        description: "Android CI run whose 'Package stable signed release' job succeeded"
        type: string
        required: true
      reuse_tbx_from:
        description: "Release tag whose .tbx assets are carried over unchanged (optional)"
        type: string
        required: false
      notes:
        description: "Release notes (Markdown)"
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Attach signed delivery and publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
      REUSE: ${{ inputs.reuse_tbx_from }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Check the source run and tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $TAG" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Unexpected run id" >&2; exit 1; }
          gh run view "$RUN_ID" --json conclusion,workflowName,headSha \
            --jq 'select(.workflowName == "Android CI" and .conclusion == "success") | .headSha' > head_sha.txt
          test -s head_sha.txt || { echo "Run $RUN_ID is not a successful Android CI run" >&2; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already exists" >&2; exit 1; fi
      - name: Download the signed delivery
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="toolbox-v${version}-release-$(cat head_sha.txt)"
          gh run download "$RUN_ID" -n "$name" -D dist
          test -f "dist/toolbox-v${version}-release.apk" || { echo "Signed APK for $version missing" >&2; ls -la dist; exit 1; }
          if [ -f dist/SHA256SUMS.txt ]; then (cd dist && sha256sum -c SHA256SUMS.txt); fi
      - name: Carry over unchanged TBX packages
        if: ${{ inputs.reuse_tbx_from != '' }}
        run: |
          set -euo pipefail
          mkdir -p reused
          gh release download "$REUSE" --pattern '*.tbx' -D reused
          gh release download "$REUSE" --pattern 'SHA256SUMS.txt' -O reused/previous-sums.txt
          (cd reused && grep '\.tbx$' previous-sums.txt | sha256sum -c -)
          cp reused/*.tbx dist/
      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assets and publish
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --draft --target "$(cat head_sha.txt)" \
            --title "ToolBox Android ${TAG#v}" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
