name: Finish and validate backup and theme implementation
on:
  push:
    branches: ["codex/backup-restore"]
    paths: [".github/workflows/backup-resume.yml"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Fix directory fsync using public Android constants
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/backup-restore
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/io/toolbox/host/backup/HostBackupService.kt')
          text = p.read_text()
          old = 'OsConstants.O_RDONLY or OsConstants.O_DIRECTORY'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'OsConstants.O_RDONLY'))
          PY
          git diff --check
          git add app/src/main/kotlin/io/toolbox/host/backup/HostBackupService.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use public Android API for durable backup directory fsync'
          git push origin HEAD:refs/heads/codex/backup-restore
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-sha.txt
          git archive --format=zip --output=evidence/source.zip HEAD
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile and run unit tests on the recorded source
        run: |
          set -o pipefail
          ./gradlew --no-daemon verifySecurityInvariants :tool-api:verifyToolBoxApiContract :app:assembleDebug :app:compileDebugAndroidTestKotlin :core-data:compileDebugAndroidTestKotlin :app:testDebugUnitTest :core-data:testDebugUnitTest :tool-package:testDebugUnitTest :tool-runtime:testDebugUnitTest 2>&1 | tee evidence/build.log
      - name: Enable KVM
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android behavior tests without screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.host.backup.HostBackupServiceTest,io.toolbox.host.backup.BackupScreenTest,io.toolbox.host.runtime.TbxUpgradePersistenceTest,io.toolbox.host.runtime.RuntimeStandardStorageInstrumentedTest,io.toolbox.host.runtime.RuntimeThemeInheritanceTest
            ./gradlew --no-daemon :core-data:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.toolbox.core.data.FreshPersistenceContractTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: backup-theme-android-${{ github.run_id }}
          path: |
            evidence/
            app/build/test-results/
            core-data/build/test-results/
            tool-package/build/test-results/
            tool-runtime/build/test-results/
            app/build/outputs/androidTest-results/
            core-data/build/outputs/androidTest-results/
            app/build/outputs/apk/debug/
          retention-days: 14
  nextflux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test and build actual Nextflux sources
        working-directory: examples/nextflux
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee nextflux-tests.log
          npm run package 2>&1 | tee nextflux-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: nextflux-theme-${{ github.run_id }}
          path: |
            examples/nextflux/*.log
            examples/nextflux/*.tbx
            examples/nextflux/dist/
          if-no-files-found: warn
          retention-days: 14
