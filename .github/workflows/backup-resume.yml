name: Retrieve preserved backup source

on:
  push:
    branches: ["codex/backup-restore"]
    paths: [".github/workflows/backup-resume.yml"]

permissions:
  contents: read

jobs:
  retrieve:
    if: github.ref == 'refs/heads/codex/backup-restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve only the known source objects for local review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, urllib.request
          from pathlib import Path
          root = 'https://api.github.com/repos/gkeyes/ToolBox-Android'
          def get(endpoint):
              req = urllib.request.Request(root + '/' + endpoint, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          blobs = ['55e02621754d3abe80c708230f89b80d6527bdb3', '5322156717de99fa841ee5786905c8d52ce92c60', '2ec927c430d9f981b1d5f65674ab3bff0bdc8dcc', 'ce4157d2e632bb0d2a362bac6c6f484dd1fb703a', 'c8af6ea4eeb919a65390f9333eba82bc9bb66758', 'c51f4570c8ae35d46fd3bd5ae23905ba75e01d2f']
          chunks = []
          for sha in blobs:
              blob = get('git/blobs/' + sha)
              if blob['encoding'] != 'base64' or blob['size'] > 10000:
                  raise SystemExit('Unexpected source object')
              chunks.append(base64.b64decode(blob['content']).decode('ascii').strip())
          packed = base64.b64decode(''.join(chunks), validate=True)
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(packed, max_length=4000000)
          if not decoder.eof or decoder.unused_data:
              raise SystemExit('Invalid or oversized source archive')
          Path('preserved-backup.patch').write_bytes(patch)
          Path('SHA256SUMS.txt').write_text(hashlib.sha256(patch).hexdigest() + '  preserved-backup.patch\n')
          print('Retrieved source patch bytes:', len(patch))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preserved-backup-source
          path: |
            preserved-backup.patch
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
