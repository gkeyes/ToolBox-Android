name: Apply backup and theme fixes
on:
  push:
    branches: ["codex/backup-restore"]
    paths: [".github/workflows/backup-resume.yml"]
permissions:
  contents: write
jobs:
  apply-and-compile:
    if: github.ref == 'refs/heads/codex/backup-restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source patch without changing workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/backup-restore
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse HEAD^)" = '6bdf7d85128301829e2b4b1fb3885f0aa477001f'
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, urllib.request
          from pathlib import Path
          req = urllib.request.Request('https://api.github.com/repos/gkeyes/ToolBox-Android/git/blobs/01d0c735aefdafa15bdfc8c33834452952c9f115', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              blob = json.load(response)
          if blob['encoding'] != 'base64' or blob['size'] != 9264:
              raise SystemExit('Unexpected source object')
          decoder = bz2.BZ2Decompressor()
          patch = decoder.decompress(base64.b64decode(base64.b64decode(blob['content']), validate=True), max_length=1000000)
          if not decoder.eof or decoder.unused_data or hashlib.sha256(patch).hexdigest() != 'a562fe04ad0255ef551c032a3b84d97555cc3bd9bb70005556d1e19b301e6e19':
              raise SystemExit('Source integrity mismatch; nothing applied')
          Path('/tmp/backup-theme.patch').write_bytes(patch)
          PY
          git apply --exclude='.github/*' --check /tmp/backup-theme.patch
          git apply --exclude='.github/*' --index /tmp/backup-theme.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make backup restore locks reentrant and propagate host theme into TBX WebViews'
          git rev-parse HEAD | tee /tmp/implementation-sha.txt
          git archive --format=zip --output=/tmp/implementation-source.zip HEAD
          git push origin HEAD:refs/heads/codex/backup-restore
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile implementation and execute unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon verifySecurityInvariants :tool-api:verifyToolBoxApiContract :app:assembleDebug :app:compileDebugAndroidTestKotlin :core-data:compileDebugAndroidTestKotlin :app:testDebugUnitTest :core-data:testDebugUnitTest :tool-package:testDebugUnitTest 2>&1 | tee /tmp/implementation-build.log
      - name: Preserve actual source and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-implementation-build-${{ github.run_id }}
          path: |
            /tmp/implementation-sha.txt
            /tmp/implementation-source.zip
            /tmp/implementation-build.log
            app/build/test-results/
            core-data/build/test-results/
            tool-package/build/test-results/
            app/build/outputs/apk/debug/
          if-no-files-found: warn
          retention-days: 14
