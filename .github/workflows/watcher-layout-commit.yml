name: Commit verified watcher notification layout
on:
  push:
    branches: ["codex/fix-github-watcher-live-notification"]
    paths: [".github/workflows/watcher-layout-commit.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gkeyes/ToolBox-Android' && github.ref == 'refs/heads/codex/fix-github-watcher-live-notification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/fix-github-watcher-live-notification
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Apply the immutable, already verified edit
        run: |
          set -euo pipefail
          base=b9b0e8b235a2e1ec17722f27781e3c9cadab80d6
          test "$(git ls-remote origin refs/heads/codex/refactor-lightweight-v2 | cut -f1)" = "$base"
          git diff --name-only "$base" HEAD | LC_ALL=C sort > /tmp/bootstrap-files.txt
          printf '%s\n' .github/workflows/watcher-layout-commit.yml .github/workflows/watcher-layout-edit.yml | diff -u - /tmp/bootstrap-files.txt
          python3 <<'PY'
          import subprocess
          import textwrap
          source = subprocess.check_output(['git', 'show', '22c423b02594ff30ed297294894f4a5ec403ddce:.github/workflows/watcher-layout-edit.yml'], text=True)
          script = source.split("          python3 <<'PY'\n", 1)[1].split('          PY\n', 1)[0]
          exec(compile(textwrap.dedent(script), 'reviewed-watcher-edit', 'exec'))
          PY
      - name: Verify watcher behavior on GitHub
        run: |
          set -euo pipefail
          node --check examples/github-actions-watcher/github-model.js
          node --check examples/github-actions-watcher/app.js
          node --test examples/github-actions-watcher/github-model.test.js examples/github-actions-watcher/app.test.js
          git diff --check
      - name: Commit only this branch and remove both temporary workflows
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/fix-github-watcher-live-notification
          git -c core.quotepath=false diff --name-only | LC_ALL=C sort > /tmp/watcher-actual-files.txt
          diff -u /tmp/watcher-changed-files.txt /tmp/watcher-actual-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r file; do git add -- "$file"; done < /tmp/watcher-changed-files.txt
          git rm -- .github/workflows/watcher-layout-edit.yml .github/workflows/watcher-layout-commit.yml
          git commit -m 'fix: simplify GitHub watcher live notifications to three layers'
          git push origin HEAD:refs/heads/codex/fix-github-watcher-live-notification
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
