name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint, screenshot
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify host gate
        run: >-
          bash scripts/qa/run-host-gate.sh
          --attempt "$GITHUB_WORKSPACE/.omo/evidence/ci-host-gate"

      - name: Upload host gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-gate-${{ github.run_id }}
          path: ${{ github.workspace }}/.omo/evidence/ci-host-gate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  instrumentation:
    name: Host and persistence instrumentation
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run admitted device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest :core-data:connectedDebugAndroidTest
