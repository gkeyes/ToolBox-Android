name: Android CI

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore:
      - "examples/github-actions-watcher/**"
      - ".github/workflows/github-actions-watcher.yml"
      - "TESTING.md"
  pull_request:
    paths-ignore:
      - "examples/github-actions-watcher/**"
      - ".github/workflows/github-actions-watcher.yml"
      - "TESTING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smallest admitted unit suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37

      - name: Verify offline developer help and generic packager
        run: |
          node scripts/check-developer-help.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_package_tool.py' -v

      - name: Verify protocol, security, compile and admitted unit suite
        run: >-
          bash scripts/qa/run-host-gate.sh
          --attempt "$GITHUB_WORKSPACE/.omo/evidence/ci-host-gate"

      - name: Validate the redesigned host preview matrix
        run: ./gradlew --no-daemon :app:validateDebugScreenshotTest

      - name: Upload rendered host previews
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-previews-${{ github.run_id }}
          path: |
            app/src/screenshotTestDebug/reference
            app/build/reports/screenshotTest
            app/build/outputs/screenshotTest-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload host gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-gate-${{ github.run_id }}
          path: ${{ github.workspace }}/.omo/evidence/ci-host-gate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  delivery:
    name: Package statically verified v0.3.5 delivery
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37

      - name: Restore stable APK signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEYSTORE_BASE64" ]]
          [[ -n "$SIGNING_STORE_PASSWORD" ]]
          [[ -n "$SIGNING_KEY_ALIAS" ]]
          [[ -n "$SIGNING_KEY_PASSWORD" ]]

          signing_dir="$RUNNER_TEMP/toolbox-signing"
          signing_file="$signing_dir/toolbox-signing.p12"
          mkdir -p "$signing_dir"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          keytool -list \
            -keystore "$signing_file" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null
          printf 'TOOLBOX_SIGNING_STORE_FILE=%s\n' "$signing_file" >> "$GITHUB_ENV"

      - name: Assemble delivery APK after prerequisite success
        env:
          TOOLBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          TOOLBOX_SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          TOOLBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify stable APK signing certificate
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk_path="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          expected_cert="$(
            keytool -exportcert \
              -keystore "$TOOLBOX_SIGNING_STORE_FILE" \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" 2>/dev/null |
              sha256sum |
              awk '{print $1}'
          )"
          actual_cert="$(
            "$apksigner" verify --print-certs "$apk_path" |
              awk '/certificate SHA-256 digest: / {sub(/^.*certificate SHA-256 digest: /, ""); if (!found++) print}'
          )"
          printf 'Keystore certificate SHA-256: %s\n' "$expected_cert"
          printf 'APK certificate SHA-256: %s\n' "$actual_cert"
          [[ -n "$expected_cert" ]]
          [[ "$actual_cert" == "$expected_cert" ]]
          printf 'TOOLBOX_APK_CERT_SHA256=%s\n' "$actual_cert" >> "$GITHUB_ENV"

      - name: Verify bundled example packages are reproducible
        run: |
          first_sums="$RUNNER_TEMP/toolbox-example-sums-first.txt"
          second_sums="$RUNNER_TEMP/toolbox-example-sums-second.txt"
          bash scripts/package-examples.sh
          shasum -a 256 \
            build/examples/position-calculator.tbx \
            build/examples/quick-notes.tbx \
            build/examples/background-task-demo.tbx \
            build/examples/notification-lab.tbx > "$first_sums"
          bash scripts/package-examples.sh
          shasum -a 256 \
            build/examples/position-calculator.tbx \
            build/examples/quick-notes.tbx \
            build/examples/background-task-demo.tbx \
            build/examples/notification-lab.tbx > "$second_sums"
          diff -u "$first_sums" "$second_sums"

      - name: Verify APK embeds the shipped examples
        run: |
          apk_path="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$apk_path" > "$RUNNER_TEMP/toolbox-apk-files.txt"
          grep -Fx 'assets/position-calculator.tbx' "$RUNNER_TEMP/toolbox-apk-files.txt"
          grep -Fx 'assets/quick-notes.tbx' "$RUNNER_TEMP/toolbox-apk-files.txt"
          grep -Fx 'assets/background-task-demo.tbx' "$RUNNER_TEMP/toolbox-apk-files.txt"
          grep -Fx 'assets/notification-lab.tbx' "$RUNNER_TEMP/toolbox-apk-files.txt"
          grep -Fx 'assets/manual.md' "$RUNNER_TEMP/toolbox-apk-files.txt"
          unzip -p "$apk_path" assets/manual.md | cmp - sdk/help/manual.md
          ! grep -Fx 'assets/stock-monitor.tbx' "$RUNNER_TEMP/toolbox-apk-files.txt"

      - name: Verify stock monitor package is reproducible and uses the public API
        run: |
          node --check examples/stock-monitor/app.js
          node --check examples/stock-monitor/live-summary.js
          node --test examples/stock-monitor/live-summary.test.js
          ! grep -R --line-number --fixed-strings 'notifications.focus' examples/stock-monitor
          first_sum="$RUNNER_TEMP/stock-monitor-first.sha256"
          second_sum="$RUNNER_TEMP/stock-monitor-second.sha256"
          bash examples/stock-monitor/package.sh
          shasum -a 256 build/examples/stock-monitor.tbx | awk '{print $1}' > "$first_sum"
          bash examples/stock-monitor/package.sh
          shasum -a 256 build/examples/stock-monitor.tbx | awk '{print $1}' > "$second_sum"
          diff -u "$first_sum" "$second_sum"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("examples/stock-monitor/manifest.json").read_text())
          assert manifest["version"] == "1.1.1"
          assert manifest["versionCode"] == 3
          assert manifest["minHostVersion"] == "0.3.2"
          PY

      - name: Assemble checksummed delivery
        env:
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          [[ "$VERIFY_JOB_RESULT" == "success" ]]

          delivery_dir="$GITHUB_WORKSPACE/build/ci-delivery"
          mkdir -p "$delivery_dir"

          apk_path="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "$apk_path" ]]
          stock_path="$GITHUB_WORKSPACE/build/examples/stock-monitor.tbx"
          [[ -f "$stock_path" ]]
          cp "$apk_path" "$delivery_dir/toolbox-v0.3.5-debug.apk"
          cp "$stock_path" "$delivery_dir/stock-monitor-v1.1.1.tbx"

          {
            printf 'BUILD_COMMIT=%s\n' "$(git rev-parse HEAD)"
            printf 'BUILD_REF=%s\n' "$GITHUB_REF"
            printf 'VERSION_NAME=0.3.5\n'
            printf 'VERSION_CODE=9\n'
            printf 'APK_SIGNING_CERT_SHA256=%s\n' "$TOOLBOX_APK_CERT_SHA256"
            printf 'STOCK_MONITOR_VERSION=1.1.1\n'
            printf 'STOCK_MONITOR_VERSION_CODE=3\n'
            printf 'VERIFY_JOB=Build and smallest admitted unit suite\n'
            printf 'VERIFY_RESULT=%s\n' "$VERIFY_JOB_RESULT"
            printf 'DEVELOPER_HELP_CHECK=PASS\n'
            printf 'DEVELOPER_HELP_PACKAGER_TESTS=PASS\n'
            printf 'HOST_SCREENSHOT_VALIDATION=PASS\n'
            printf 'NETWORK_GATEWAY_REGRESSION=PASS\n'
            printf 'PERMISSION_MANIFEST_REGRESSION=PASS\n'
            printf 'DETAIL_DIALOG_REGRESSION=COMPILED_NOT_RUN_USER_OWNED\n'
            printf 'LIVE_NOTIFICATION_COLOR_REGRESSION=COMPILED_NOT_RUN_USER_OWNED\n'
            printf 'ANDROID_INSTRUMENTATION_COMPILE=PASS\n'
            printf 'ANDROID_INSTRUMENTATION_EXECUTION=NOT_RUN_USER_OWNED\n'
            printf 'DEVICE_TEST_RESULT=NOT_RUN_USER_OWNED\n'
            printf 'HYPEROS_ISLAND_TEST_RESULT=NOT_RUN_USER_OWNED\n'
            printf 'APK_SOURCE=app/build/outputs/apk/debug/app-debug.apk\n'
            printf 'STOCK_MONITOR_SOURCE=build/examples/stock-monitor.tbx\n'
            printf 'EMBEDDED_EXAMPLES=position-calculator.tbx,quick-notes.tbx,background-task-demo.tbx,notification-lab.tbx\n'
            printf 'DELIVERY_FILES=toolbox-v0.3.5-debug.apk,stock-monitor-v1.1.1.tbx,SHA256SUMS.txt,BUILD_AND_TEST_RECEIPT.txt\n'
          } > "$delivery_dir/BUILD_AND_TEST_RECEIPT.txt"

          (
            cd "$delivery_dir"
            LC_ALL=C shasum -a 256 \
              toolbox-v0.3.5-debug.apk \
              stock-monitor-v1.1.1.tbx \
              BUILD_AND_TEST_RECEIPT.txt > SHA256SUMS.txt
          )

      - name: Upload verified v0.3.5 delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbox-v0.3.5-${{ github.sha }}
          path: |
            build/ci-delivery/toolbox-v0.3.5-debug.apk
            build/ci-delivery/stock-monitor-v1.1.1.tbx
            build/ci-delivery/SHA256SUMS.txt
            build/ci-delivery/BUILD_AND_TEST_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14
