name: Android CI

# Every push and pull request runs the contract checks and script tests. Lint, both APK builds and every
# JVM unit test run on every push to main, and on a pull request whose changes Gradle compiles or packages
# (scripts/ci/pr_scope.py; a PR that only touches CI scripts, docs or the version number skips them).
# Emulator behavior tests are opt-in from a manual run. Pushes to the default branch also build the
# signed release and cold-start it on an emulator before uploading it. On the default branch the APK version
# is computed first from the changelog fragments in changes/ (scripts/ci/app_version.py); pull requests never
# edit it. A push that only adds a fragment (changes/*.md) still runs, so a follow-up fragment for a change
# that reached main without one rebuilds and publishes it.
on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!**.md"
      - "changes/*.md"
      - "sdk/help/**"
      - "!docs/**"
      - "!examples/**"
      - "examples/position-calculator/**"
      - "examples/quick-notes/**"
      - "examples/background-task-demo/**"
      - "examples/notification-lab/**"
      - "!examples/*/tests/**"
      - "!.github/workflows/tbx.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/webview-debugging.yml"
      - "!scripts/ci/tbx.py"
      - "!scripts/tests/bundled-tools.test.cjs"
  pull_request:
    branches: ["main"]
    paths:
      - "**"
      - "!**.md"
      - "sdk/help/**"
      - "!docs/**"
      - "!examples/**"
      - "examples/position-calculator/**"
      - "examples/quick-notes/**"
      - "examples/background-task-demo/**"
      - "examples/notification-lab/**"
      - "!examples/*/tests/**"
      - "!.github/workflows/tbx.yml"
      - "!.github/workflows/release.yml"
      - "!.github/workflows/webview-debugging.yml"
      - "!scripts/ci/tbx.py"
      - "!scripts/tests/bundled-tools.test.cjs"
  workflow_dispatch:
    inputs:
      run_android_ui_tests:
        description: "Run the Android emulator behavior tests"
        type: boolean
        default: false
      android_test_filter:
        description: "Optional: only these emulator tests, as module=Class or module=Class#method (module is app, tool-runtime or core-data; bare class means app), comma separated"
        type: string
        required: false

permissions:
  contents: read

# PR and manual runs restart on a new commit. Pushes to main never cancel a running build, so a quick
# series of merges cannot starve the test channel; a newer push only replaces one still waiting. Push runs
# therefore run one at a time, so the version job of one never reads `dev` while another push run is still
# publishing. A manual run is in its own group and can overlap a push run; the publish job re-checks `dev`
# before publishing (app_version.py check-dev).
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  version:
    name: Compute the app version
    runs-on: ubuntu-24.04
    # The version every APK build of this run uses: the last build on `dev` raised by the fragments added
    # since its commit. Empty on pull requests and other branches, whose builds use app/build.gradle.kts.
    outputs:
      name: ${{ steps.compute.outputs.name }}
      code: ${{ steps.compute.outputs.code }}
      base: ${{ steps.compute.outputs.base_name && format('{0} ({1})', steps.compute.outputs.base_name, steps.compute.outputs.base_code) || '' }}
      base_commit: ${{ steps.compute.outputs.base_commit }}
      changes: ${{ steps.compute.outputs.changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        with:
          persist-credentials: false
          # Full history: fragments and shipped changes are counted from the last published build's commit.
          fetch-depth: 0
      # Fails when a change since the last published build ships in the APK without a fragment (the PR check
      # cannot see what other PRs merged after it ran). Only a missing `dev` release falls back to the values
      # in app/build.gradle.kts; any other lookup failure is retried, then stops the run before any build.
      - name: Compute the version from the changelog fragments
        id: compute
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/app_version.py compute --head "$GITHUB_SHA"

  verify:
    name: Build APKs and verify host behavior
    needs: [version]
    # Lint and tests still report when the version job refused the build (nothing is published then).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      # Blank on pull requests (and when the version job failed): Gradle then uses the version written in
      # app/build.gradle.kts.
      TOOLBOX_VERSION_NAME: ${{ needs.version.outputs.name }}
      TOOLBOX_VERSION_CODE: ${{ needs.version.outputs.code }}
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # A pull request compares its head with the commit it branched from (full history). The depth is
          # quoted because a bare 0 is falsy and `&& 0 || 1` would always pick 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Select what this pull request needs
        id: pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          grep -q '^gradle=true' "$GITHUB_OUTPUT" \
            || echo "Gradle build and JVM tests skipped: nothing this PR changed is compiled or packaged." >> "$GITHUB_STEP_SUMMARY"
      - name: Select emulator scope
        id: scope
        env:
          RUN_ANDROID_UI: ${{ inputs.run_android_ui_tests == true }}
          ANDROID_TEST_FILTER: ${{ inputs.android_test_filter || '' }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_TEST_FILTER" ]; then
            printf '%s\n' "$ANDROID_TEST_FILTER" | grep -Eq '^((app|tool-runtime|core-data)=)?io\.toolbox\.[A-Za-z0-9_.#]+(,((app|tool-runtime|core-data)=)?io\.toolbox\.[A-Za-z0-9_.#]+)*$' \
              || { echo "Unexpected android_test_filter: $ANDROID_TEST_FILTER" >&2; exit 1; }
            checks=selected
          elif [ "$RUN_ANDROID_UI" = true ]; then
            checks=full
          else
            checks=build_and_unit_only
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          echo "Android emulator behavior checks: \`$checks\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Verify API contract, embedded SDK, and security entry points
        run: node scripts/ci/verify-host-contract.mjs
      - name: Verify browser scripts
        run: node --test scripts/tests/browser-picker.test.cjs scripts/tests/browser-media-layout.test.cjs scripts/tests/browser-media-layout-chromium.test.cjs
      - name: Verify CI and packaging scripts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
        if: ${{ steps.pr.outputs.gradle != 'false' }}
      - name: Lint, build APKs and compile emulator tests
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        run: >-
          ./gradlew --no-daemon :app:lint :app:assembleDebug :app:assembleRelease
          :app:compileDebugAndroidTestKotlin :tool-runtime:compileDebugAndroidTestKotlin
          :core-data:compileDebugAndroidTestKotlin
      - name: Run all JVM unit tests
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        run: >-
          ./gradlew --no-daemon :core-data:testDebugUnitTest :core-ui:testDebugUnitTest
          :tool-package:testDebugUnitTest :tool-runtime:testDebugUnitTest :tool-api:testDebugUnitTest
          :app:testDebugUnitTest
      - name: Enable accelerated emulator
        if: ${{ steps.scope.outputs.checks != 'build_and_unit_only' }}
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and system image, retrying bad downloads
        if: ${{ steps.scope.outputs.checks != 'build_and_unit_only' }}
        run: bash scripts/ci/install-emulator.sh 36 google_apis x86_64
      - name: Run Android behavior tests on the emulator
        if: ${{ steps.scope.outputs.checks != 'build_and_unit_only' }}
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          TOOLBOX_ANDROID_TEST_FILTER: ${{ inputs.android_test_filter || '' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p build/emulator-evidence
            adb shell getprop ro.build.version.release > build/emulator-evidence/android-version.txt
            adb shell dumpsys webviewupdate > build/emulator-evidence/webview-provider.txt
            bash scripts/ci/run-android-behavior.sh
      - name: Retain unit test reports
        if: ${{ always() && steps.pr.outputs.gradle != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-tests-${{ github.sha }}
          path: |
            */build/test-results/
            */build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain Android behavior evidence
        if: ${{ always() && steps.emulator.outcome != 'skipped' && steps.emulator.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-behavior-${{ github.sha }}
          path: |
            tool-runtime/build/outputs/androidTest-results/connected/
            tool-runtime/build/reports/androidTests/connected/
            core-data/build/outputs/androidTest-results/connected/
            core-data/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/**/button-preview-*.png
            build/emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.pr.outputs.gradle != 'false' }}
        with:
          name: apk-${{ github.sha }}
          path: app/build/outputs/apk/
          if-no-files-found: warn
          retention-days: 7

  delivery:
    name: Package stable signed release
    # Runs alongside verify; nothing is delivered until the publish job sees both succeed.
    # PRs never receive the signing key.
    needs: [version]
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    env:
      TOOLBOX_RELEASE_CERT_SHA256: 849be1fd8066964d6194faa538fc0b17b4b17e5c116304e1d3be8ff725e4c71d
      # The computed version, for the Gradle build and the cold-start check of the installed version.
      TOOLBOX_VERSION_NAME: ${{ needs.version.outputs.name }}
      TOOLBOX_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Build optimized release with the original signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_BASE64 }}
          TOOLBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          TOOLBOX_SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          TOOLBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Original signing key is required; no replacement key will be generated}"
          : "${TOOLBOX_SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${TOOLBOX_SIGNING_KEY_ALIAS:?Missing signing alias}"
          : "${TOOLBOX_SIGNING_KEY_PASSWORD:?Missing key password}"
          signing_dir="$RUNNER_TEMP/toolbox-signing"
          mkdir -p "$signing_dir" build/release-evidence
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          export TOOLBOX_SIGNING_STORE_FILE="$signing_dir/toolbox.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TOOLBOX_SIGNING_STORE_FILE"
          chmod 600 "$TOOLBOX_SIGNING_STORE_FILE"
          keytool -exportcert -keystore "$TOOLBOX_SIGNING_STORE_FILE" -storepass:env TOOLBOX_SIGNING_STORE_PASSWORD -alias "$TOOLBOX_SIGNING_KEY_ALIAS" > "$signing_dir/certificate.der" 2>/dev/null
          actual="$(sha256sum "$signing_dir/certificate.der" | awk '{print $1}')"
          test "$actual" = "$TOOLBOX_RELEASE_CERT_SHA256" || { echo 'Original release certificate mismatch' >&2; exit 1; }
          unset SIGNING_KEYSTORE_BASE64
          : "${TOOLBOX_VERSION_NAME:?The computed version is required for the signed release}"
          : "${TOOLBOX_VERSION_CODE:?The computed version code is required for the signed release}"
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build/release-evidence/release-build.log
      - name: Verify embedded resources match build inputs
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -p "$apk" assets/manual.md | cmp - sdk/help/manual.md
          bundled="$(jq -r 'to_entries[] | select(.value.bundled == true) | .key' scripts/ci/tbx-targets.json)"
          test -n "$bundled"
          for example in $bundled; do
            unzip -p "$apk" "assets/$example.tbx" | cmp - "build/bundled-examples/$example.tbx"
          done
      - name: Enable accelerated release startup emulator
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and system image, retrying bad downloads
        run: bash scripts/ci/install-emulator.sh 35 google_apis x86_64
      - name: Cold-start the signed release and verify its initial home
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/ci/release-startup-smoke.py
      - name: Record release certificate and badging
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/37.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > build/release-evidence/signature.txt
          "$tools/aapt" dump badging "$apk" > build/release-evidence/badging.txt
      - name: Hand the signed release to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
            build/release-evidence/
          if-no-files-found: error
          retention-days: 1
      - name: Remove signing material even on failure
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/toolbox-signing"
      - name: Retain release verification and R8 evidence
        if: ${{ always() }}
        # Diagnostics only; a failed copy must not hold back publishing.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-optimization-${{ github.sha }}
          path: |
            build/release-evidence/
            app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 30

  screenshots:
    # Separate from verify so the screenshot render adds no time to the main checks.
    name: Layout screenshots at 320dp and largest font
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Select what this pull request needs
        id: pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
        if: ${{ steps.pr.outputs.gradle != 'false' }}
      - name: Render screens and check text layout
        if: ${{ steps.pr.outputs.gradle != 'false' }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Ptoolbox.screenshots=true
      - name: Upload screenshots
        if: ${{ !cancelled() && steps.pr.outputs.gradle != 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-screenshots-${{ github.sha }}
          path: |
            build/screenshots/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  publish-screenshots:
    name: Publish layout screenshots
    needs: [screenshots]
    # Only a fully green render of main replaces the shared set; a failed run or a manual run on another
    # branch keeps its artifact for diagnosis.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # One publisher at a time across refs, so two runs never mix their assets on the shared release.
    concurrency:
      group: ui-screenshots-publish
      cancel-in-progress: false
    permissions:
      # Only to refresh the `ui-screenshots` prerelease that holds the latest renders for review.
      contents: write
      actions: read
    steps:
      - name: Replace the screenshots on the ui-screenshots prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n "layout-screenshots-$GITHUB_SHA" -D shots || { echo "No screenshots in this run"; exit 0; }
          files=$(find shots -name '*.png' | sort)
          [ -n "$files" ] || { echo "No screenshots in this run"; exit 0; }
          notes="Layout screenshots from ${REF_NAME} at ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID}). Not an app release."
          if gh release view ui-screenshots >/dev/null 2>&1; then
            gh release view ui-screenshots --json assets --jq '.assets[].name' | while read -r name; do gh release delete-asset ui-screenshots "$name" -y; done
            gh release edit ui-screenshots --notes "$notes"
          else
            gh release create ui-screenshots --prerelease --latest=false --target "$GITHUB_SHA" --title "UI screenshots" --notes "$notes"
          fi
          # shellcheck disable=SC2086
          gh release upload ui-screenshots $files --clobber
          # Keep the rolling tag on the commit the screenshots came from.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/ui-screenshots" -f sha="$GITHUB_SHA" -F force=true >/dev/null

  publish:
    name: Publish verified signed release
    needs: [version, verify, delivery]
    # Push and manual runs on main use different run groups; publishing to `dev` is serialized
    # across both so the commit-order check in publish-test-release.sh can't race another publisher.
    concurrency:
      group: toolbox-dev-channel-app
      cancel-in-progress: false
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      # Only to refresh the rolling `dev` prerelease behind the in-app test channel.
      contents: write
      # To download the signed release that the delivery job uploaded.
      actions: read
    env:
      TOOLBOX_RELEASE_CERT_SHA256: 849be1fd8066964d6194faa538fc0b17b4b17e5c116304e1d3be8ff725e4c71d
      # verify_release.py checks the APK against this version and writes it, the version it was raised from
      # and the fragments' changelog lines into BUILD_RECEIPT.txt (the publisher puts them in the dev notes).
      TOOLBOX_VERSION_NAME: ${{ needs.version.outputs.name }}
      TOOLBOX_VERSION_CODE: ${{ needs.version.outputs.code }}
      TOOLBOX_VERSION_BASE: ${{ needs.version.outputs.base }}
      TOOLBOX_CHANGES: ${{ needs.version.outputs.changes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # Full history: the dev check below tells whether a newer published build contains this commit.
          fetch-depth: 0
      - name: Download the signed release from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n "release-candidate-$GITHUB_SHA" -D .
          test -f app/build/outputs/apk/release/app-release.apk
          test -f build/release-evidence/startup/result.json
      - name: Verify release certificate identity and optimization then assemble delivery
        env:
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          ALLOW_UNTESTED_STARTUP: "false"
          HOST_VERIFICATION_SCOPE: current_run
          HOST_VERIFICATION_RUN: ${{ github.run_id }}
          HOST_VERIFICATION_ATTEMPT: ${{ github.run_attempt }}
          HOST_VERIFICATION_COMMIT: ${{ github.sha }}
          HOST_VERIFICATION_CHECKS: ${{ needs.verify.outputs.checks }}
          HOST_ANDROID_TEST_FILTER: ${{ inputs.android_test_filter || '' }}
        run: python3 scripts/ci/verify_release.py
      - name: Upload verified signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbox-v${{ env.TOOLBOX_VERSION }}-release-${{ github.sha }}
          path: build/ci-delivery/
          if-no-files-found: error
          # Publish release reads it by run id; published builds also live on their Release.
          retention-days: 30
      # The version job read `dev` when this run started and refused a shipped change without a fragment.
      # Publishing is serialized, but a manual run can overlap a push run (separate run groups), and a re-run
      # of failed jobs reuses the old version job's result: if another build reached `dev` since, this version
      # may not be new, so stop. Lookups retry, then fail closed; only a missing release counts as none.
      - name: Require dev to be unchanged since the version was computed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_COMMIT: ${{ needs.version.outputs.base_commit }}
        run: python3 scripts/ci/app_version.py check-dev --base-commit "$BASE_COMMIT" --head "$GITHUB_SHA" --version "$TOOLBOX_VERSION_NAME" --apk "$(find build/ci-delivery -maxdepth 1 -name 'toolbox-v*-release.apk' -print -quit)"
      - name: Publish to the in-app test channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/publish-test-release.sh app build/ci-delivery
