name: Android CI

on:
  push:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - "**"
      - "!README.md"
      - "!docs/**"
      - "!core-data/schemas/**"
      - "!scripts/tests/watcher-reliability.test.cjs"
      - "!scripts/tests/tool-runtime-performance.test.cjs"
      - "!examples/**"
      - "examples/position-calculator/**"
      - "examples/quick-notes/**"
      - "examples/background-task-demo/**"
      - "examples/notification-lab/**"
      - "!.github/workflows/tbx.yml"
      - "!scripts/ci/**"
      - "scripts/ci/verify_release.py"
      - "scripts/ci/verify-host-contract.mjs"
      - "scripts/ci/targeted-checks.py"
      - "scripts/ci/reuse-host-verification.py"
      - "scripts/ci/run-android-behavior.sh"
      - "scripts/ci/release-startup-smoke.py"
      - "scripts/tests/test_release_startup.py"
      - "scripts/tests/test_reuse_host_verification.py"
  pull_request:
    branches: ["codex/refactor-lightweight-v2"]
    paths:
      - "**"
      - "!README.md"
      - "!docs/**"
      - "!core-data/schemas/**"
      - "!scripts/tests/watcher-reliability.test.cjs"
      - "!scripts/tests/tool-runtime-performance.test.cjs"
      - "!examples/**"
      - "examples/position-calculator/**"
      - "examples/quick-notes/**"
      - "examples/background-task-demo/**"
      - "examples/notification-lab/**"
      - "!.github/workflows/tbx.yml"
      - "!scripts/ci/**"
      - "scripts/ci/verify_release.py"
      - "scripts/ci/verify-host-contract.mjs"
      - "scripts/ci/targeted-checks.py"
      - "scripts/ci/reuse-host-verification.py"
      - "scripts/ci/run-android-behavior.sh"
      - "scripts/ci/release-startup-smoke.py"
      - "scripts/tests/test_release_startup.py"
      - "scripts/tests/test_reuse_host_verification.py"
  workflow_dispatch:
    inputs:
      run_android_ui_tests:
        description: "Explicitly run Android emulator behavior and signed-startup checks"
        type: boolean
        default: false
      validation_scope:
        description: "Checks to run: full, performance, selected cases, or reuse a completed run"
        type: choice
        options: [full, performance, targeted, reuse]
        default: full
      unit_test_filter:
        description: "For targeted runs: module=fully.qualified.TestClass#method, comma separated"
        type: string
        required: false
      android_test_filter:
        description: "For targeted runs: app or tool-runtime=class#method, comma separated; bare class means app"
        type: string
        required: false
      node_test_path:
        description: "For targeted runs: scripts/tests/browser-*.test.cjs paths, comma separated"
        type: string
        required: false
      reuse_verified_run:
        description: "Optional completed host-check run whose source is merged and unchanged; preserves its verification scope"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ inputs.android_test_filter && 'Verify selected Android test' || 'Build APK and verify host behavior' }}
    runs-on: ubuntu-24.04
    outputs:
      verification_scope: ${{ steps.baseline.outputs.scope }}
      verification_run: ${{ steps.baseline.outputs.source_run }}
      verification_attempt: ${{ steps.baseline.outputs.source_attempt }}
      verification_commit: ${{ steps.baseline.outputs.base_commit }}
      verification_checks: ${{ steps.android_ui.outputs.enabled == 'false' && 'build_and_unit_only' || steps.baseline.outputs.checks }}
      unit_filter: ${{ steps.baseline.outputs.unit_filter }}
      android_filter: ${{ steps.baseline.outputs.android_filter }}
      node_filter: ${{ steps.baseline.outputs.node_filter }}
      android_ui_enabled: ${{ steps.android_ui.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Select focused checks for known source changes
        id: targeted
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'full' }}
          UNIT_TEST_FILTER: ${{ inputs.unit_test_filter || '' }}
          ANDROID_TEST_FILTER: ${{ inputs.android_test_filter || '' }}
          NODE_TEST_PATH: ${{ inputs.node_test_path || '' }}
          RUN_ANDROID_UI: ${{ inputs.run_android_ui_tests == true }}
          REUSE_VERIFIED_RUN: ${{ inputs.reuse_verified_run || '' }}
        run: python3 scripts/ci/targeted-checks.py plan
      - name: Apply selected Android test filter
        run: echo "TARGET_ANDROID_TEST=${{ steps.targeted.outputs.android }}" >> "$GITHUB_ENV"
      - name: Select Android emulator test policy
        id: android_ui
        env:
          RUN_ANDROID_UI: ${{ inputs.run_android_ui_tests == true }}
        run: |
          run_ui=false
          reason=''
          if [ -n "$TARGET_ANDROID_TEST" ]; then
            run_ui=true
            reason="Only the requested test will run: $TARGET_ANDROID_TEST"
          elif [ "$RUN_ANDROID_UI" = true ]; then
            run_ui=true
            reason='Manual Android emulator request.'
          fi
          echo "enabled=$run_ui" >> "$GITHUB_OUTPUT"
          if [ "$run_ui" = true ]; then
            printf '## Android emulator checks: ENABLED\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## Android emulator checks: NOT RUN' \
              'No Android test filter or manual emulator run was requested.' \
              'Neither Android behavior nor signed-startup checks ran; no full-device validation is claimed.' \
              'Manual workflow runs can explicitly enable run_android_ui_tests.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Select current or unchanged host verification evidence
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_VERIFIED_RUN: ${{ inputs.reuse_verified_run || '' }}
          VALIDATION_SCOPE: ${{ steps.targeted.outputs.scope }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ '${{ steps.targeted.outputs.scope }}' = targeted ]; then
            printf '%s\n' 'scope=current_run' 'checks=targeted' \
              "source_run=$GITHUB_RUN_ID" "source_attempt=$GITHUB_RUN_ATTEMPT" \
              "base_commit=$(git rev-parse HEAD)" \
              "unit_filter=${{ steps.targeted.outputs.unit }}" \
              "android_filter=${{ steps.targeted.outputs.android }}" \
              "node_filter=${{ steps.targeted.outputs.node }}" >> "$GITHUB_OUTPUT"
          elif [ '${{ steps.targeted.outputs.scope }}' = docs_only ]; then
            printf '%s\n' 'scope=docs_only' 'checks=docs_only' \
              "source_run=$GITHUB_RUN_ID" "base_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/reuse-host-verification.py
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        with:
          node-version: "22"
      - name: Verify API contract, embedded SDK, and security entry points
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        run: node scripts/ci/verify-host-contract.mjs
      - name: Verify browser picker selection and restore regressions
        if: ${{ env.TARGET_ANDROID_TEST == '' && steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks != 'targeted' }}
        run: node --test scripts/tests/browser-picker.test.cjs
      - name: Verify browser media layout recovery regressions
        if: ${{ env.TARGET_ANDROID_TEST == '' && steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks != 'targeted' }}
        run: node --test scripts/tests/browser-media-layout.test.cjs
      - name: Verify browser media layout in real Chromium
        if: ${{ env.TARGET_ANDROID_TEST == '' && steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks != 'targeted' }}
        run: node --test scripts/tests/browser-media-layout-chromium.test.cjs
      - name: Verify watcher polling and stopped-session regressions
        if: ${{ env.TARGET_ANDROID_TEST == '' && steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks != 'targeted' }}
        run: node --test scripts/tests/watcher-reliability.test.cjs
      - name: Verify selected browser Node cases
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'targeted' && steps.targeted.outputs.node != '' }}
        env:
          NODE_TEST_PATH: ${{ steps.targeted.outputs.node }}
        run: python3 scripts/ci/targeted-checks.py node --filters "$NODE_TEST_PATH"
      - name: Verify release evidence and baseline reuse guards
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_reuse_host_verification.py' -v
          if [ '${{ steps.baseline.outputs.scope }}' = current_run ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_release_startup.py' -v
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_release_scope.py' -v
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
      - name: Generate actual Room v1 schema from the fixed installed baseline
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.android_ui.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/toolbox-room-v1"
          mkdir -p "$baseline_dir"
          git archive 06cd8ec7899f139f974c4c72b565af59a3f91118 | tar -x -C "$baseline_dir"
          python3 - "$baseline_dir" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          database = root / 'core-data/src/main/kotlin/io/toolbox/core/data/db/ToolBoxDatabase.kt'
          source = database.read_text()
          assert 'exportSchema = false' in source and 'version = 1' in source
          database.write_text(source.replace('exportSchema = false', 'exportSchema = true'))
          gradle = root / 'core-data/build.gradle.kts'
          source = gradle.read_text()
          marker = 'arg("room.generateKotlin", "true")'
          assert marker in source
          gradle.write_text(source.replace(marker, marker + '\n    arg("room.schemaLocation", "$projectDir/schemas")'))
          PY
          (cd "$baseline_dir" && ./gradlew --no-daemon :core-data:kspDebugKotlin)
          schema="$baseline_dir/core-data/schemas/io.toolbox.core.data.db.ToolBoxDatabase/1.json"
          test -s "$schema"
          mkdir -p app/src/androidTest/assets/room-v1
          cp "$schema" app/src/androidTest/assets/room-v1/1.json
      - name: Lint the complete Android app
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        run: ./gradlew --no-daemon :app:lint
      - name: Verify Wasm binary packaging
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'full' }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_package_tool.py' -v
      - name: ${{ steps.baseline.outputs.checks == 'targeted' && 'Build debug and release APKs for selected checks' || (steps.android_ui.outputs.enabled == 'false' && 'Build APKs (Android UI tests disabled)' || (steps.baseline.outputs.checks == 'performance' && 'Compile performance test APK' || 'Build APKs and behavioral test APKs')) }}
        if: ${{ steps.baseline.outputs.scope == 'current_run' }}
        env:
          VALIDATION_SCOPE: ${{ steps.baseline.outputs.checks }}
          SKIP_ANDROID_UI: ${{ steps.android_ui.outputs.enabled == 'false' }}
        run: |
          if [ "$VALIDATION_SCOPE" = targeted ]; then
            ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
            if [ "$SKIP_ANDROID_UI" != true ]; then
              python3 scripts/ci/targeted-checks.py android-compile --filters "$TARGET_ANDROID_TEST"
            fi
          elif [ "$SKIP_ANDROID_UI" = true ]; then
            ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          elif [ "$VALIDATION_SCOPE" = performance ]; then
            ./gradlew --no-daemon :app:assembleDebug :app:compileDebugAndroidTestKotlin
          else
            ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:compileDebugAndroidTestKotlin :tool-runtime:compileDebugAndroidTestKotlin
          fi
      - name: ${{ steps.baseline.outputs.checks == 'performance' && 'Verify performance unit regressions' || 'Verify installation, catalog, network, runtime and cancellation regressions' }}
        if: ${{ steps.baseline.outputs.scope == 'current_run' && env.TARGET_ANDROID_TEST == '' && steps.baseline.outputs.checks != 'targeted' }}
        env:
          VALIDATION_SCOPE: ${{ steps.baseline.outputs.checks }}
        run: |
          if [ "$VALIDATION_SCOPE" = performance ]; then
            ./gradlew --no-daemon :app:testDebugUnitTest \
              --tests 'io.toolbox.host.catalog.*' --tests 'io.toolbox.host.icons.*' \
              --tests 'io.toolbox.host.HostRootStateTest' --tests 'io.toolbox.host.background.*Network*Test' \
              :tool-runtime:testDebugUnitTest
          else
            ./gradlew --no-daemon :core-data:testDebugUnitTest :tool-package:testDebugUnitTest :tool-runtime:testDebugUnitTest :app:testDebugUnitTest
          fi
      - name: Verify selected unit cases
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'targeted' && steps.targeted.outputs.unit != '' }}
        env:
          UNIT_TEST_FILTER: ${{ steps.targeted.outputs.unit }}
        run: python3 scripts/ci/targeted-checks.py unit --filters "$UNIT_TEST_FILTER"
      - name: Enable accelerated behavior test emulator
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.android_ui.outputs.enabled == 'true' }}
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ${{ env.TARGET_ANDROID_TEST != '' && format('Verify {0}', env.TARGET_ANDROID_TEST) || (steps.baseline.outputs.checks == 'performance' && 'Verify performance behavior on Android' || 'Verify catalog, backup, execution identity, dialogs and Wasm on Android') }}
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.android_ui.outputs.enabled == 'true' }}
        id: runtime_emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          TOOLBOX_BEHAVIOR_SCOPE: ${{ steps.baseline.outputs.checks }}
          TOOLBOX_ANDROID_TEST_FILTER: ${{ env.TARGET_ANDROID_TEST }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p build/wasm-emulator
            adb shell getprop ro.build.version.release > build/wasm-emulator/android-version.txt
            adb shell dumpsys webviewupdate > build/wasm-emulator/webview-provider.txt
            bash scripts/ci/run-android-behavior.sh
      - name: Confirm selected Android cases actually ran
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'targeted' && steps.android_ui.outputs.enabled == 'true' }}
        env:
          ANDROID_TEST_FILTER: ${{ steps.targeted.outputs.android }}
        run: python3 scripts/ci/targeted-checks.py android-results --filters "$ANDROID_TEST_FILTER"
      - name: Verify targeted selection evidence
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'targeted' }}
        run: python3 scripts/ci/targeted-checks.py evidence-verify
      - name: Save targeted check evidence
        if: ${{ steps.baseline.outputs.scope == 'current_run' && steps.baseline.outputs.checks == 'targeted' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-targeted-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/targeted-selection.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain host unit test reports
        if: ${{ always() && steps.baseline.outputs.scope == 'current_run' && (env.TARGET_ANDROID_TEST == '' || steps.targeted.outputs.unit != '') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-unit-tests-${{ github.sha }}
          path: |
            core-data/build/test-results/
            core-data/build/reports/tests/
            tool-package/build/test-results/
            tool-package/build/reports/tests/
            tool-runtime/build/test-results/
            tool-runtime/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain Android behavior and WebView evidence
        if: ${{ always() && steps.baseline.outputs.scope == 'current_run' && steps.android_ui.outputs.enabled == 'true' && steps.runtime_emulator.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-webview-${{ github.sha }}
          path: |
            tool-runtime/build/outputs/androidTest-results/connected/
            tool-runtime/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/outputs/**/button-preview-*.png
            build/wasm-emulator/
          if-no-files-found: error
          retention-days: 14
      - name: Retain Room migration schemas
        if: ${{ always() && steps.baseline.outputs.scope == 'current_run' && steps.android_ui.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: room-schemas-${{ github.sha }}
          path: |
            app/src/androidTest/assets/room-v1/1.json
            core-data/schemas/io.toolbox.core.data.db.ToolBoxDatabase/2.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.baseline.outputs.scope == 'current_run' }}
        with:
          name: apk-${{ github.sha }}
          path: app/build/outputs/apk/
          if-no-files-found: warn

  delivery:
    name: Package stable signed release
    needs: verify
    # PRs never receive the signing key; a merged unchanged targeted run may supply verification evidence.
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.verify.outputs.verification_scope == 'current_run' || (needs.verify.outputs.verification_scope == 'reused_unchanged_host' && needs.verify.outputs.android_ui_enabled == 'true')) && (needs.verify.outputs.verification_checks == 'full' || needs.verify.outputs.verification_checks == 'targeted') }}
    runs-on: ubuntu-24.04
    env:
      TOOLBOX_RELEASE_CERT_SHA256: 849be1fd8066964d6194faa538fc0b17b4b17e5c116304e1d3be8ff725e4c71d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Build optimized release with the original signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_BASE64 }}
          TOOLBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          TOOLBOX_SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          TOOLBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Original signing key is required; no replacement key will be generated}"
          : "${TOOLBOX_SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${TOOLBOX_SIGNING_KEY_ALIAS:?Missing signing alias}"
          : "${TOOLBOX_SIGNING_KEY_PASSWORD:?Missing key password}"
          signing_dir="$RUNNER_TEMP/toolbox-signing"
          mkdir -p "$signing_dir" build/release-evidence
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          export TOOLBOX_SIGNING_STORE_FILE="$signing_dir/toolbox.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TOOLBOX_SIGNING_STORE_FILE"
          chmod 600 "$TOOLBOX_SIGNING_STORE_FILE"
          keytool -exportcert -keystore "$TOOLBOX_SIGNING_STORE_FILE" -storepass:env TOOLBOX_SIGNING_STORE_PASSWORD -alias "$TOOLBOX_SIGNING_KEY_ALIAS" > "$signing_dir/certificate.der" 2>/dev/null
          actual="$(sha256sum "$signing_dir/certificate.der" | awk '{print $1}')"
          test "$actual" = "$TOOLBOX_RELEASE_CERT_SHA256" || { echo 'Original release certificate mismatch' >&2; exit 1; }
          unset SIGNING_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build/release-evidence/release-build.log
      - name: Verify embedded resources match build inputs
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -p "$apk" assets/manual.md | cmp - sdk/help/manual.md
          for example in position-calculator quick-notes background-task-demo notification-lab; do
            unzip -p "$apk" "assets/$example.tbx" | cmp - "build/bundled-examples/$example.tbx"
          done
      - name: Enable accelerated release startup emulator
        if: ${{ needs.verify.outputs.android_ui_enabled == 'true' }}
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-start the signed release and verify its initial home
        if: ${{ needs.verify.outputs.android_ui_enabled == 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/ci/release-startup-smoke.py
      - name: Verify release certificate identity and optimization then assemble delivery
        env:
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          ALLOW_UNTESTED_STARTUP: ${{ needs.verify.outputs.android_ui_enabled == 'false' && 'true' || 'false' }}
          HOST_VERIFICATION_SCOPE: ${{ needs.verify.outputs.verification_scope }}
          HOST_VERIFICATION_RUN: ${{ needs.verify.outputs.verification_run }}
          HOST_VERIFICATION_ATTEMPT: ${{ needs.verify.outputs.verification_attempt }}
          HOST_VERIFICATION_COMMIT: ${{ needs.verify.outputs.verification_commit }}
          HOST_VERIFICATION_CHECKS: ${{ needs.verify.outputs.verification_checks }}
          HOST_UNIT_TEST_FILTER: ${{ needs.verify.outputs.unit_filter }}
          HOST_ANDROID_TEST_FILTER: ${{ needs.verify.outputs.android_filter }}
          HOST_NODE_TEST_PATH: ${{ needs.verify.outputs.node_filter }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/37.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > build/release-evidence/signature.txt
          "$tools/aapt" dump badging "$apk" > build/release-evidence/badging.txt
          python3 scripts/ci/verify_release.py
      - name: Upload verified signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbox-v${{ env.TOOLBOX_VERSION }}-release-${{ github.sha }}
          path: build/ci-delivery/
          if-no-files-found: error
      - name: Remove signing material even on failure
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/toolbox-signing"
      - name: Retain release verification and R8 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-optimization-${{ github.sha }}
          path: |
            build/release-evidence/
            app/build/outputs/mapping/release/
          if-no-files-found: warn
