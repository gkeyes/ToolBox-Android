name: NextFlux exact Miniflux scraper regression
on:
  push:
    paths:
      - .github/workflows/nextflux-exact-miniflux-regression.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: toolbox
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: miniflux/v2
          path: miniflux
      - uses: actions/setup-go@v5
        with:
          go-version-file: miniflux/go.mod
          cache-dependency-path: miniflux/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: toolbox/examples/nextflux/package-lock.json
      - name: Run official Miniflux ProcessEntryWebPage
        working-directory: miniflux
        env:
          ARTICLE_URL: https://cn.nytimes.com/world/20260925/trump-xi-state-dinner-menu/
          SCRAPER_RULE: article.article-content
          OUTPUT_HTML: ${{ github.workspace }}/miniflux-final-entry.html
        run: |
          cat > internal/reader/processor/live_exact_test.go <<'EOF'
          package processor

          import (
            "os"
            "testing"

            "miniflux.app/v2/internal/config"
            "miniflux.app/v2/internal/model"
          )

          func TestLiveExactScraper(t *testing.T) {
            config.Opts = config.NewConfigOptions()
            url := os.Getenv("ARTICLE_URL")
            rule := os.Getenv("SCRAPER_RULE")
            out := os.Getenv("OUTPUT_HTML")
            feed := &model.Feed{
              SiteURL: url,
              FeedURL: url,
              ScraperRules: rule,
            }
            entry := model.NewEntry()
            entry.URL = url
            entry.Feed = feed
            user := &model.User{
              ShowReadingTime: false,
              OpenExternalLinksInNewTab: false,
            }
            if err := ProcessEntryWebPage(feed, entry, user); err != nil {
              t.Fatal(err)
            }
            if entry.Content == "" {
              t.Fatal("empty entry content")
            }
            if err := os.WriteFile(out, []byte(entry.Content), 0644); err != nil {
              t.Fatal(err)
            }
            t.Logf("final content bytes=%d", len(entry.Content))
          }
          EOF
          go test ./internal/reader/processor -run TestLiveExactScraper -count=1 -v
          rm internal/reader/processor/live_exact_test.go
      - name: Compare exact Miniflux output with source-DOM recovery
        working-directory: toolbox/examples/nextflux
        env:
          ARTICLE_URL: https://cn.nytimes.com/world/20260925/trump-xi-state-dinner-menu/
        run: |
          npm ci --ignore-scripts
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import { DOMParser } from "linkedom";
          globalThis.DOMParser=DOMParser;
          const [{ extractWithDefuddle }, { chooseBestArticleCandidate }, { createReadingParser }] = await Promise.all([
            import("./src/reading/extractors/defuddle.mjs"),
            import("./src/reading/analyze.mjs"),
            import("./src/reading/parser.js"),
          ]);

          const minifluxHtml=fs.readFileSync(process.env.GITHUB_WORKSPACE+"/miniflux-final-entry.html","utf8");
          const response=await fetch(process.env.ARTICLE_URL,{headers:{
            "User-Agent":"Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/140 Safari/537.36",
            "Accept-Language":"zh-CN,zh;q=0.9"
          }});
          if(!response.ok) throw new Error("source fetch "+response.status);
          const sourceHtml=await response.text();
          const source=extractWithDefuddle({html:sourceHtml,url:process.env.ARTICLE_URL});
          const selection=chooseBestArticleCandidate([
            {source:"miniflux",content:minifluxHtml},
            source,
          ]);

          const parser=createReadingParser(selection.selected.content,process.env.ARTICLE_URL);
          const operations=[];
          for(;;){const batch=parser.next();operations.push(...batch.operations);if(batch.done)break;}
          const semantic=operations.filter(op=>op.type==="blockify"&&op.role);
          const report={
            miniflux:selection.candidates.find(c=>c.source==="miniflux"),
            source:selection.candidates.find(c=>c.source!=="miniflux"),
            selected:selection.selected.source,
            selectedScore:selection.selected.score,
            selectedAnalysis:selection.selected.analysis,
            semanticSections:semantic.filter(op=>op.role==="semantic-section").length,
            semanticLines:semantic.filter(op=>op.role==="semantic-line").length,
          };
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+"/exact-miniflux-report.json",JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.miniflux?.analysis?.flattenedRootText) throw new Error("Miniflux flattening was not detected");
          if(report.selected==="miniflux") throw new Error("flattened Miniflux candidate still won");
          if(report.semanticSections<3) throw new Error("source hierarchy sections not recovered");
          if(report.semanticLines<6) throw new Error("source hierarchy lines not recovered");
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-miniflux-regression
          path: |
            miniflux-final-entry.html
            exact-miniflux-report.json
