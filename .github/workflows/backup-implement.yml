name: Commit and validate backup implementation
on:
  push:
    branches: ["codex/backup-restore"]
    paths: [".github/workflows/backup-implement.yml"]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply reviewed source on unchanged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/backup-restore
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor 34df8468b4e6762e322f6bfbc7b1b816a89c2603 HEAD
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, urllib.request
          root = 'https://api.github.com/repos/gkeyes/ToolBox-Android'
          def get(path):
              req = urllib.request.Request(root + '/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
          blobs = ['55e02621754d3abe80c708230f89b80d6527bdb3', '5322156717de99fa841ee5786905c8d52ce92c60', '2ec927c430d9f981b1d5f65674ab3bff0bdc8dcc', 'ce4157d2e632bb0d2a362bac6c6f484dd1fb703a', 'c8af6ea4eeb919a65390f9333eba82bc9bb66758', 'c51f4570c8ae35d46fd3bd5ae23905ba75e01d2f']
          parts = [base64.b64decode(get('git/blobs/' + sha)['content']).decode('ascii').strip() for sha in blobs]
          patch = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '72df1eeaaf73f52a2d59aa59e45466916a3c33c79ea26939ae44c4b94761e056'
          pathlib.Path('/tmp/reviewed-backup.patch').write_bytes(patch)
          PY
          git apply --check /tmp/reviewed-backup.patch
          git apply --index /tmp/reviewed-backup.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core-data/src/main/kotlin/io/toolbox/core/data/DataMutationLock.kt')
          s = p.read_text()
          assert 'private class Owner(val lock: DataMutationLock)' in s
          s = s.replace('private class Owner(val lock: DataMutationLock)', 'private class Owner(val locks: Set<DataMutationLock>)').replace('if (currentCoroutineContext()[Owner]?.lock === this) return action()', 'val owned = currentCoroutineContext()[Owner]?.locks.orEmpty()\n        if (this in owned) return action()').replace('withContext(Owner(this)) { action() }', 'withContext(Owner(owned + this)) { action() }')
          p.write_text(s)
          p = Path('core-data/src/test/kotlin/io/toolbox/core/data/DataMutationLockTest.kt')
          s = p.read_text().replace('class DataMutationLockTest {', '''class DataMutationLockTest {
              @Test fun nestedDifferentLocksPreserveOuterOwnership() = runBlocking {
                  val packages = DataMutationLock()
                  val repositories = DataMutationLock()
                  withTimeout(2_000) {
                      assertEquals("restored", packages.run {
                          repositories.run { packages.run { repositories.run { "restored" } } }
                      })
                  }
              }
          ''')
          p.write_text(s)
          PY
          git add core-data/src
          git rm --ignore-unmatch .github/workflows/backup-implement.yml .github/workflows/backup-source-transfer.yml .github/workflows/backup-source-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement local backup restore with checked archives and durable rollback'
          git push origin HEAD:refs/heads/codex/backup-restore
          git rev-parse HEAD > /tmp/implemented-source-sha.txt
          git archive --format=zip -o /tmp/implemented-source.zip HEAD
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile and run unit tests on implemented source
        run: |
          set -o pipefail
          ./gradlew --no-daemon verifySecurityInvariants :tool-api:verifyToolBoxApiContract :app:assembleDebug :app:compileDebugAndroidTestKotlin :core-data:compileDebugAndroidTestKotlin :app:testDebugUnitTest :core-data:testDebugUnitTest :tool-package:testDebugUnitTest :tool-runtime:testDebugUnitTest 2>&1 | tee /tmp/implemented-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: implemented-backup-evidence
          path: |
            /tmp/implemented-source-sha.txt
            /tmp/implemented-source.zip
            /tmp/implemented-build.log
            app/build/test-results/
            core-data/build/test-results/
            tool-package/build/test-results/
            tool-runtime/build/test-results/
            app/build/outputs/apk/debug/
          retention-days: 7
          if-no-files-found: warn
