name: NextFlux lock refresh
on:
  push:
    paths:
      - .github/workflows/nextflux-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/refactor-lightweight-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/nextflux/package-lock.json
      - name: Refresh lock with Defuddle
        working-directory: examples/nextflux
        run: npm install --package-lock-only --ignore-scripts --save-exact defuddle@0.19.4
      - name: Commit lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/nextflux/package.json examples/nextflux/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore(nextflux): add Defuddle dependency"
            git push origin HEAD:codex/refactor-lightweight-v2
          fi
