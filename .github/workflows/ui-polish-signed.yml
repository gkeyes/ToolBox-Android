name: UI polish APK - original release signature

on:
  push:
    branches: ["codex/ui-polish-emil-20260922"]
    paths: [".github/workflows/ui-polish-signed.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-polish-original-signature
  cancel-in-progress: false

jobs:
  sign:
    name: Sign the successful UI-polish Release APK
    if: ${{ github.repository == 'gkeyes/ToolBox-Android' && github.event_name == 'push' && github.ref == 'refs/heads/codex/ui-polish-emil-20260922' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN: "35680323971"
      SOURCE_ARTIFACT: "10674187065"
      SOURCE_HEAD: "09dd867350d022a1e96c99d6c12a74051ec7635d"
      SOURCE_BUILD: "8b807ef395057954b73b6e6509eab8ff80786991"
      SOURCE_ZIP_SHA256: "0be51ecefed54f1a83d501a5cdd73ed4541140f0931f7ed0a7266597929821a6"
      SOURCE_APK_SHA256: "5bad9a1b881eb46881069567280419d4165ff0ca8a38bdae145db6b4590634bf"
      REFERENCE_APK_SHA256: "193bb200934c5e04138166e071b1161f1500a530236d053e08bce22373092e3a"
      RELEASE_CERT_SHA256: "849be1fd8066964d6194faa538fc0b17b4b17e5c116304e1d3be8ff725e4c71d"
    steps:
      # This is a one-source signing job, not a PR job or a rebuild. No repository
      # scripts execute with the signing key. UI tests remain explicitly NOT RUN.
      - name: Download and pin the approved APK and original release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input delivery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > input/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > input/artifact.json
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_HEAD...$GITHUB_SHA" > input/compare.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > input/source.zip
          curl --fail --location --proto '=https' --retry 3 \
            'https://github.com/gkeyes/ToolBox-Android/releases/download/v0.8.5/toolbox-v0.8.5-release.apk' \
            --output input/reference.apk
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          p = pathlib.Path('input')
          run = json.loads((p / 'run.json').read_text())
          artifact = json.loads((p / 'artifact.json').read_text())
          diff = json.loads((p / 'compare.json').read_text())
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'pull_request' and run['workflow_id'] == 343747488
          assert run['head_sha'] == os.environ['SOURCE_HEAD']
          assert run['head_branch'] == 'codex/ui-polish-emil-20260922'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT']) and not artifact['expired']
          assert artifact['workflow_run']['id'] == run['id']
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_HEAD']
          assert artifact['name'] == 'apk-' + os.environ['SOURCE_BUILD']
          assert artifact['digest'] == 'sha256:' + os.environ['SOURCE_ZIP_SHA256']
          assert diff['status'] == 'ahead' and diff['merge_base_commit']['sha'] == os.environ['SOURCE_HEAD']
          assert [f['filename'] for f in diff['files']] == ['.github/workflows/ui-polish-signed.yml'], 'App source changed; approve a new build before signing'
          for name, key in [('source.zip', 'SOURCE_ZIP_SHA256'), ('reference.apk', 'REFERENCE_APK_SHA256')]:
              assert hashlib.sha256((p / name).read_bytes()).hexdigest() == os.environ[key], name
          with zipfile.ZipFile(p / 'source.zip') as z:
              name = 'release/app-release-unsigned.apk'
              assert z.namelist().count(name) == 1 and z.getinfo(name).file_size < 50_000_000
              apk = z.read(name)
              metadata = json.loads(z.read('release/output-metadata.json'))
          assert hashlib.sha256(apk).hexdigest() == os.environ['SOURCE_APK_SHA256']
          assert metadata['applicationId'] == 'io.toolbox.host' and metadata['variantName'] == 'release'
          assert len(metadata['elements']) == 1
          assert metadata['elements'][0]['versionCode'] == 38
          assert metadata['elements'][0]['versionName'] == '0.8.5'
          (p / 'unsigned.apk').write_bytes(apk)
          print('Pinned successful Release APK: io.toolbox.host 0.8.5 (38). No rebuild or UI tests.')
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          packages: build-tools;37.0.0
      - name: Align and sign with the existing release key only
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_BASE64 }}
          TOOLBOX_SIGNING_STORE_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEYSTORE_PASSWORD }}
          TOOLBOX_SIGNING_KEY_ALIAS: ${{ secrets.TOOLBOX_ANDROID_KEY_ALIAS }}
          TOOLBOX_SIGNING_KEY_PASSWORD: ${{ secrets.TOOLBOX_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Original signing key required; no replacement key is allowed}"
          : "${TOOLBOX_SIGNING_STORE_PASSWORD:?Missing store password}"
          : "${TOOLBOX_SIGNING_KEY_ALIAS:?Missing key alias}"
          : "${TOOLBOX_SIGNING_KEY_PASSWORD:?Missing key password}"
          signing_dir="$RUNNER_TEMP/toolbox-ui-signing"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/toolbox.p12"
          chmod 600 "$signing_dir/toolbox.p12"
          unset SIGNING_KEYSTORE_BASE64
          keytool -exportcert -keystore "$signing_dir/toolbox.p12" \
            -storepass:env TOOLBOX_SIGNING_STORE_PASSWORD -alias "$TOOLBOX_SIGNING_KEY_ALIAS" \
            > "$signing_dir/certificate.der" 2>/dev/null
          test "$(sha256sum "$signing_dir/certificate.der" | cut -d' ' -f1)" = "$RELEASE_CERT_SHA256"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/zipalign" -P 16 -f 4 input/unsigned.apk input/aligned.apk
          "$tools/apksigner" sign --ks "$signing_dir/toolbox.p12" \
            --ks-key-alias "$TOOLBOX_SIGNING_KEY_ALIAS" \
            --ks-pass env:TOOLBOX_SIGNING_STORE_PASSWORD --key-pass env:TOOLBOX_SIGNING_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
            --v4-signing-enabled false --out delivery/toolbox-v0.8.5-ui-polish-signed.apk input/aligned.apk
      - name: Verify actual APK certificates, package, version and unchanged payload
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/37.0.0"
          apk=delivery/toolbox-v0.8.5-ui-polish-signed.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > delivery/SIGNATURE.txt
          "$tools/apksigner" verify --verbose --print-certs input/reference.apk > delivery/REFERENCE_SIGNATURE.txt
          cat delivery/SIGNATURE.txt delivery/REFERENCE_SIGNATURE.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > delivery/BADGING.txt
          "$tools/aapt" dump badging input/reference.apk > input/reference-badging.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          d = pathlib.Path('delivery')
          def cert(path):
              text = path.read_text()
              assert re.search(r'^Number of signers:\s*1\s*$', text, re.M), 'Expected exactly one APK signer'
              # Build Tools 37 uses V2 Signer instead of the older Signer #1 label.
              values = {v.lower() for v in re.findall(r'^.*certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\s*$', text, re.M)}
              assert len(values) == 1, 'Expected one consistent certificate across signing schemes'
              return values.pop()
          actual = cert(d / 'SIGNATURE.txt')
          assert actual == cert(d / 'REFERENCE_SIGNATURE.txt') == os.environ['RELEASE_CERT_SHA256']
          def identity(path):
              text = path.read_text()
              assert 'application-debuggable' not in text
              match = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", text)
              assert match, 'Missing package identity'
              return match.groups()
          assert identity(d / 'BADGING.txt') == identity(pathlib.Path('input/reference-badging.txt')) == ('io.toolbox.host', '38', '0.8.5')
          apk = d / 'toolbox-v0.8.5-ui-polish-signed.apk'
          with zipfile.ZipFile('input/unsigned.apk') as before, zipfile.ZipFile(apk) as after:
              assert before.namelist() == after.namelist(), 'Signing must not add or remove app entries'
              for name in before.namelist():
                  assert before.read(name) == after.read(name), 'App payload changed: ' + name
          receipt = {
              'package': 'io.toolbox.host', 'version_name': '0.8.5', 'version_code': 38,
              'source_head': os.environ['SOURCE_HEAD'], 'source_build_commit': os.environ['SOURCE_BUILD'],
              'source_run': os.environ['SOURCE_RUN'], 'source_artifact': os.environ['SOURCE_ARTIFACT'],
              'source_zip_sha256': os.environ['SOURCE_ZIP_SHA256'], 'unsigned_apk_sha256': os.environ['SOURCE_APK_SHA256'],
              'signing_commit': os.environ['GITHUB_SHA'], 'signing_run': os.environ['GITHUB_RUN_ID'],
              'reference_release': 'v0.8.5', 'reference_apk_sha256': os.environ['REFERENCE_APK_SHA256'],
              'certificate_sha256': actual, 'signed_apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'app_payload_unchanged': True, 'certificate_matches_original_release': True,
              'android_ui_tests': 'NOT RUN - user-requested waiver', 'device_installation': 'NOT RUN',
              'delivery_kind': 'signed UI-polish branch build; not a new official Release',
          }
          (d / 'BUILD_RECEIPT.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
          (cd delivery && sha256sum toolbox-v0.8.5-ui-polish-signed.apk SIGNATURE.txt REFERENCE_SIGNATURE.txt BADGING.txt BUILD_RECEIPT.json > SHA256SUMS.txt)
          printf '%s\n' '## Original-signature UI-polish APK' \
            'Signed the exact Release APK from successful run 35680323971; no rebuild.' \
            'Actual APK certificate equals the published v0.8.5 certificate; package io.toolbox.host, version 0.8.5 (38).' \
            'All APK entry contents are unchanged. UI tests and device installation: NOT RUN.' \
            'No default-branch change, PR merge or public Release publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and signature evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toolbox-v0.8.5-ui-polish-original-signature
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing material on all exits
        if: ${{ always() }}
        shell: bash
        run: rm -rf "$RUNNER_TEMP/toolbox-ui-signing"
