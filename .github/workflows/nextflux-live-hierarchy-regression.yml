name: NextFlux live hierarchy regression
on:
  push:
    paths:
      - .github/workflows/nextflux-live-hierarchy-regression.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/nextflux/package-lock.json
      - working-directory: examples/nextflux
        run: npm ci --ignore-scripts
      - name: Verify real article through current reading parser
        working-directory: examples/nextflux
        env:
          ARTICLE_URL: https://cn.nytimes.com/world/20260925/trump-xi-state-dinner-menu/
        run: |
          node --input-type=module <<'EOF'
          import { parseHTML } from "linkedom";
          import { Defuddle } from "defuddle/node";
          import { createReadingParser } from "./src/reading/parser.js";
          const url=process.env.ARTICLE_URL;
          const response=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/140 Safari/537.36","Accept-Language":"zh-CN,zh;q=0.9"}});
          if(!response.ok) throw new Error("fetch "+response.status);
          const html=await response.text();
          const {document:working}=parseHTML(html);
          const result=await Defuddle(working,url,{debug:true,useAsync:false,removeHiddenElements:false,standardize:true});
          const {document:original}=parseHTML(html);
          const root=original.querySelector(result?.debug?.contentSelector||"article");
          if(!root) throw new Error("article root missing");
          const parser=createReadingParser(root.innerHTML,url);
          const operations=[];
          for(;;){const batch=parser.next();operations.push(...batch.operations);if(batch.done)break;}
          const semantic=operations.filter(op=>op.type==="blockify"&&op.role);
          const sections=semantic.filter(op=>op.role==="semantic-section");
          const lines=semantic.filter(op=>op.role==="semantic-line");
          console.log(JSON.stringify({status:response.status,sections:sections.length,lines:lines.length,semantic},null,2));
          if(sections.length<3) throw new Error("expected structural sections were not recovered");
          if(lines.length<6) throw new Error("expected structural lines were not recovered");
          EOF
