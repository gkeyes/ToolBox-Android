name: Materialize backup implementation

on:
  push:
    branches: ["codex/backup-restore"]
    paths: [".github/backup-transfer/**"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/codex/backup-restore'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Apply exact reviewed source and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/backup-restore
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python3 - <<'PY'
          import base64, bz2, hashlib
          from pathlib import Path
          parts = sorted(Path('.github/backup-transfer').glob('part-*.txt'))
          if len(parts) != 6:
              raise SystemExit('Source transfer is not complete yet')
          data = bz2.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          if hashlib.sha256(data).hexdigest() != 'dfb414ce976609c89b8498f8f57da3ea7938c6712f6e3a550f11a8b754d35a628fb5':
              raise SystemExit('Transfer checksum mismatch')
          Path('/tmp/backup-implementation.patch').write_bytes(data)
          PY
          git apply --check /tmp/backup-implementation.patch
          git apply --index /tmp/backup-implementation.patch
          git rm -r .github/backup-transfer .github/workflows/backup-source-transfer.yml
          test "$(git write-tree)" = '94d0614f462387ad9066a25f32b1bb091aebd82ae'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement local backup restore with validation and durable rollback'
          git push origin HEAD:refs/heads/codex/backup-restore
          git rev-parse HEAD > source-sha.txt
          git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: materialized-backup-source
          path: |
            source.zip
            source-sha.txt
          retention-days: 7
