name: Prepare reviewed consolidation tree
on:
  push:
    branches: ["codex/fix-watcher-background-20260922"]
    paths: [".github/workflows/apply-consolidation-review.yml"]
permissions:
  contents: write
jobs:
  prepare:
    if: ${{ github.repository == 'gkeyes/ToolBox-Android' && github.ref == 'refs/heads/codex/fix-watcher-background-20260922' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PREVIOUS_HEAD: 4dfce0945e701a3809db2af775f1a52ec2106e8b
      DEFAULT_HEAD: cf08609012bda1cf3e74109b6402ffe074bca324
      NEXTFLUX_HEAD: b02196c4fe14840ce99e26dac1a0a2ae31a6cf8c
      EXPECTED_TREE: 361315ea1dae926f2a30f0d4504870e228bf732e
      REVIEW_SCRIPT: 3c13495f138cac089d112d1e7bdff1562b026ec4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve immutable reviewed script
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$REVIEW_SCRIPT" --jq '.content' | base64 --decode > "$RUNNER_TEMP/review.py"
          test "$(git hash-object "$RUNNER_TEMP/review.py")" = "$REVIEW_SCRIPT"
      - name: Prepare exact reviewed source without moving branches
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PREVIOUS_HEAD" HEAD
          test "$(git diff --name-only "$PREVIOUS_HEAD" HEAD)" = '.github/workflows/apply-consolidation-review.yml'
          test "$(git rev-parse refs/remotes/origin/codex/refactor-lightweight-v2)" = "$DEFAULT_HEAD"
          test "$(git rev-parse refs/remotes/origin/codex/nextflux-reading-1.0.12)" = "$NEXTFLUX_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-ff --no-commit "$DEFAULT_HEAD"; then
            python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          expected = {'examples/github-actions-watcher/' + name for name in ('app.js','index.html','manifest.json','package.sh')}
          assert paths == expected, paths
          subprocess.run(['git','checkout','3c0795bc7912afb0f30fdcc71d3d54da3e4bfb10','--',*sorted(paths)], check=True)
          PY
          fi
          git commit -m 'Preserve latest default branch history in consolidation'
          git merge --no-ff --no-commit "$NEXTFLUX_HEAD"
          git commit -m 'Preserve NextFlux reading fixes in consolidation'
          python3 "$RUNNER_TEMP/review.py"
          git rm .github/workflows/apply-consolidation-review.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Store reviewed Git objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          def git(*args): return subprocess.check_output(['git',*args])
          def api(path, data):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          final=git('write-tree').decode().strip()
          assert final==os.environ['EXPECTED_TREE']
          base=os.environ['GITHUB_SHA']
          changes=git('diff','--name-status','--no-renames','-z',base,final).decode().rstrip('\0').split('\0')
          entries=[]
          for status,path in zip(changes[::2],changes[1::2]):
              if status=='D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              raw=git('ls-tree',final,'--',path).decode().split('\t')[0]
              mode,kind,sha=raw.split()
              assert kind=='blob'
              blob=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(git('cat-file','blob',sha)).decode()})
              assert blob['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          tree=api('/git/trees',{'base_tree':git('rev-parse',base+'^{tree}').decode().strip(),'tree':entries})
          assert tree['sha']==final
          out=pathlib.Path(os.environ['RUNNER_TEMP'],'review-receipt');out.mkdir()
          receipt={'tree_sha':final,'source_head':base,'default_head':os.environ['DEFAULT_HEAD'],'nextflux_head':os.environ['NEXTFLUX_HEAD'],'changed_files':entries,'branches_modified':False,'builds_or_tests_run':False}
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('REVIEWED_TREE='+final)
          print('SOURCE_HEAD='+base)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Prepared reviewed Git tree '+final+'. No branch was moved. No tests or builds were run.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-consolidation-tree
          path: ${{ runner.temp }}/review-receipt/
          if-no-files-found: error
          retention-days: 7
