name: WebView debugging controls

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/webview-debugging.yml"
      - "app/build.gradle.kts"
      - "app/src/main/kotlin/io/toolbox/host/help/DeveloperHelpScreen.kt"
      - "app/src/androidTest/kotlin/io/toolbox/host/DeveloperWebViewDebuggingBehaviorTest.kt"
      - "tool-runtime/src/main/kotlin/io/toolbox/tool/runtime/RuntimeWebViewDebugging.kt"
      - "tool-runtime/src/main/kotlin/io/toolbox/tool/runtime/HardenedRuntimeWebView.kt"
      - "scripts/ci/install-emulator.sh"
      - "scripts/ci/webview-debugging-connected.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview-debugging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # app/build.gradle.kts is watched for its debugging flags; a PR that only raises the version number
  # there skips the emulator runs (scripts/ci/pr_scope.py). Manual runs always verify.
  select:
    name: Select
    runs-on: ubuntu-24.04
    outputs:
      webview: ${{ steps.scope.outputs.webview || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/pr_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify ${{ matrix.variant }} debugging state on a user Android image
    needs: select
    if: ${{ needs.select.outputs.webview == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            task-suffix: Debug
            arguments: ""
          - variant: verification
            task-suffix: Verification
            arguments: "-Ptoolbox.verifyWebViewDebugging=true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Compile the selected APK signed only for testing
        run: ./gradlew --no-daemon :app:assemble${{ matrix.task-suffix }} :app:compile${{ matrix.task-suffix }}AndroidTestKotlin ${{ matrix.arguments }}
      - name: Enable accelerated emulator
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the emulator and system image, retrying bad downloads
        run: bash scripts/ci/install-emulator.sh 35 google_apis_playstore x86_64
      - name: Verify the full debugging test class on production Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p build/webview-debugging
            adb shell getprop ro.build.type > build/webview-debugging/android-build-type.txt
            adb shell dumpsys webviewupdate > build/webview-debugging/webview-provider.txt
            python3 -c "from pathlib import Path; assert Path('build/webview-debugging/android-build-type.txt').read_text().strip() == 'user'"
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash scripts/ci/webview-debugging-connected.sh connected${{ matrix.task-suffix }}AndroidTest ${{ matrix.arguments }}
      - name: Require the debugging scenarios to run and pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = []
          for path in Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              cases.extend(case for case in ET.parse(path).getroot().iter('testcase')
                           if case.get('classname') == 'io.toolbox.host.DeveloperWebViewDebuggingBehaviorTest')
          assert cases, 'No DeveloperWebViewDebuggingBehaviorTest case ran'
          bad = [case.get('name') for case in cases
                 if any(case.find(tag) is not None for tag in ('failure', 'error', 'skipped'))]
          assert not bad, f'Failed, errored or skipped scenarios: {bad}'
          print(f'Verified {len(cases)} executed scenarios with no failures, errors, or skips.')
          PY
      - name: Report failed scenarios as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      node = case.find(tag)
                      if node is not None:
                          text = (node.get('message') or '') + ' ' + (node.text or '')
                          text = ' '.join(text.split())[:1500].replace('%', '%25')
                          print(f"::error title={case.get('name')}::{text}")
          # Without test results the run stopped earlier: surface which setup step got that far.
          evidence = Path('build/webview-debugging')
          print('::error title=Evidence files::' + (', '.join(sorted(p.name for p in evidence.glob('*'))) or 'none'))
          log = evidence / 'connected-test.log'
          if log.exists():
              lines = [line for line in log.read_text(errors='replace').splitlines()
                       if any(key in line for key in ('FAILED', 'Exception', 'Error', 'error:', 'Crash', 'crash', 'Tests on', 'BUILD'))]
              print('::error title=Connected test log::' + ' | '.join(lines[-25:]).replace('%', '%25')[:3500])
          crash = evidence / 'logcat-crash.txt'
          if crash.exists() and crash.read_text(errors='replace').strip():
              lines = [line for line in crash.read_text(errors='replace').splitlines() if 'crashpad' not in line]
              print('::error title=Crash buffer::' + ' | '.join(lines[:60]).replace('%', '%25')[:3800])
          full = evidence / 'logcat.txt'
          if full.exists():
              lines = [line for line in full.read_text(errors='replace').splitlines()
                       if any(key in line for key in ('FATAL', 'AndroidRuntime', 'DEBUG', 'libc', 'chromium', 'cr_', 'TestRunner'))]
              print('::error title=Logcat::' + ' | '.join(lines[-40:]).replace('%', '%25')[:3800])
          PY
      - name: Retain behavior reports and environment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: webview-debugging-${{ matrix.variant }}-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            build/webview-debugging/
          if-no-files-found: warn
          retention-days: 14
