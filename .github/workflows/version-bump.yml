name: Version check

# Every pull request, whatever it touches: a change to anything that ships in the APK must add a changelog
# fragment in changes/ (the version is computed on main; editing versionCode / versionName fails), and a
# change to a mini-tool's .tbx must raise its versionCode and MAJOR.MINOR.PATCH version above the base branch.
# The rules and what counts as shipped are in scripts/ci/version_bump.py and CONTRIBUTING.md.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Shipped changes raise the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          # Full history with every branch: the check reads the PR head, the base branch as it is when the
          # job runs (checkout fetches it now), and their merge base.
          fetch-depth: 0
      - name: Unit tests for the check
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_version_bump.py scripts/tests/test_app_version.py -v
      # Tool versions are compared with the base branch as it is when the check runs, not as it was when the
      # PR's event fired, so a tool version another PR merged meanwhile is caught. The APK needs no such
      # comparison: its version is computed on main from the fragments, so PRs never collide on it. On every
      # push to main, android.yml's version job refuses an APK change without a fragment and tbx.yml's publish
      # job refuses an unbumped tool (--push).
      - name: Require a changelog fragment or version bump for shipped changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/version_bump.py --base "$(git rev-parse "origin/$BASE_REF")" --head "$HEAD_SHA"
