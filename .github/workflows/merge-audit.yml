name: Consolidation audit snapshot
on:
  push:
    branches: ["codex/fix-watcher-background-20260922"]
    paths: [".github/workflows/merge-audit.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked history only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merge-audit"
          git for-each-ref --format='%(objectname) %(refname)' refs/remotes/origin/ > "$RUNNER_TEMP/merge-audit/refs.txt"
          git bundle create "$RUNNER_TEMP/merge-audit/repository.bundle" --all
          sha256sum "$RUNNER_TEMP/merge-audit/repository.bundle" > "$RUNNER_TEMP/merge-audit/SHA256.txt"
          printf '%s\n' 'Tracked Git objects for branch audit only. No APK build, tests or signing.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consolidation-source-${{ github.sha }}
          path: ${{ runner.temp }}/merge-audit/
          retention-days: 3
          if-no-files-found: error
